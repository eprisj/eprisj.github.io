<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Futuroshock — EPRIS</title><style>body{margin:0;background:#f6f1eb;color:#24151b;font:14px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:40px 24px}h1{font:400 52px Georgia,serif;margin:8px 0}.eyebrow{font:10px monospace;letter-spacing:.18em;text-transform:uppercase;color:#a63d2c}.lede{color:#766a6f;max-width:680px;line-height:1.6}.grid{display:grid;grid-template-columns:280px 1fr;gap:28px;margin-top:32px}.list{border-top:1px solid #d9cec5}.item{display:block;width:100%;padding:14px;text-align:left;border:0;border-bottom:1px solid #d9cec5;background:transparent;cursor:pointer}.item.active{background:#eadfd7}.item small{display:block;color:#8a7b80;margin-top:5px}.form{background:#fff;border:1px solid #d9cec5;padding:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;color:#766a6f;font-size:12px}label.wide{grid-column:1/-1}input,textarea,select{font:inherit;border:1px solid #d9cec5;padding:10px;background:#fff;color:#24151b}textarea{resize:vertical}button,.link{border:0;background:#501a2c;color:#fff;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-block}.danger{background:transparent;color:#a63d2c;border:1px solid #a63d2c}.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}.notice{color:#501a2c}img{max-width:180px;max-height:120px;object-fit:cover;margin-top:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}label.wide{grid-column:auto}}
</style></head><body><main><a class="link" href="/admin/">← Админка</a><p class="eyebrow">EPRIS / digital exhibition</p><h1>Futuroshock</h1><p class="lede">Приём авторских 2D-изображений и 3D-объектов. Для 3D укажите публичный URL GLB/GLTF. Для 2D загрузите обложку и добавьте контекст работы.</p><div class="grid"><div id="list" class="list"></div><section class="form"><div class="fields"><label>ID<input id="id"></label><label>Название<input id="title"></label><label>Автор<input id="author"></label><label>Год<input id="year"></label><label>Медиум<input id="medium"></label><label>Формат<select id="format"><option value="2d">2D image</option><option value="3d">3D model</option></select></label><label class="wide">URL обложки<input id="imageUrl"></label><label class="wide">URL GLB / GLTF<input id="modelUrl"></label><label class="wide">Связанная статья<input id="relatedArticleUrl"></label><label class="wide">Материалы, через запятую<input id="materials"></label><label class="wide">Авторское описание<textarea id="statement" rows="6"></textarea></label></div><div class="actions"><label class="link">Загрузить обложку<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><label><span><input id="published" type="checkbox"> Опубликовать</span></label></div><img id="preview" hidden><div class="actions"><button id="save">Сохранить работу</button><button id="remove" class="danger">Удалить</button><span id="notice" class="notice"></span></div></section></div></main><script>
const API='https://api.eprisjournal.com/content', UPLOAD='https://api.eprisjournal.com/upload';let data=null,active=null;const $=id=>document.getElementById(id);const fields=['id','title','author','year','medium','format','imageUrl','modelUrl','relatedArticleUrl','materials','statement'];function pw(){try{return atob(localStorage.getItem('epris_admin_pw_saved')||'')}catch{return''}}function setForm(w={}){active=w.id||null;fields.forEach(k=>$(k).value=k==='materials'?(w.materials||[]).join(', '):(w[k]||''));$('published').checked=!w.draft;$('preview').hidden=!w.imageUrl;if(w.imageUrl){$('preview').src=w.imageUrl}document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===active))}function render(){const list=$('list');list.innerHTML='';(data?.futuroshock||[]).forEach(w=>{const b=document.createElement('button');b.className='item';b.dataset.id=w.id;b.innerHTML='<b>'+esc(w.title||'Без названия')+'</b><small>'+esc(w.author||'')+' · '+String(w.format||'2d').toUpperCase()+' · '+(w.draft?'черновик':'опубликовано')+'</small>';b.onclick=()=>setForm(w);list.appendChild(b)})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const r=await fetch(API,{cache:'no-store'});data=await r.json();render();setForm({id:'fs-'+Date.now(),year:String(new Date().getFullYear()),format:'2d',draft:true})}function read(){const w={};fields.forEach(k=>w[k]=k==='materials'?$(k).value.split(',').map(x=>x.trim()).filter(Boolean):$(k).value.trim());w.draft=!$('published').checked;return w}async function save(){const w=read();if(!w.id||!w.title||!w.author){$('notice').textContent='Нужны ID, название и автор';return}data.futuroshock=Array.isArray(data.futuroshock)?data.futuroshock:[];const i=data.futuroshock.findIndex(x=>x.id===w.id);if(i<0)data.futuroshock.push(w);else data.futuroshock[i]=w;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':pw()},body:JSON.stringify(data)});const j=await r.json();$('notice').textContent=j.ok?'Сохранено — сайт обновлён':'Ошибка: '+(j.error||r.status);if(j.ok){data=j.data||data;render();setForm(w)}}async function upload(file){const b=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file)});const r=await fetch(UPLOAD,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':pw()},body:JSON.stringify({filename:file.name,contentType:file.type,data:b})});const j=await r.json();if(!j.ok)throw Error(j.error||'upload failed');$('imageUrl').value=j.url;$('preview').src=j.url;$('preview').hidden=false;$('notice').textContent='Обложка загружена'}$('save').onclick=save;$('remove').onclick=async()=>{const id=$('id').value;if(!id||!confirm('Удалить работу?'))return;data.futuroshock=(data.futuroshock||[]).filter(x=>x.id!==id);const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':pw()},body:JSON.stringify(data)});const j=await r.json();$('notice').textContent=j.ok?'Удалено':'Ошибка: '+(j.error||r.status);if(j.ok){render();setForm({id:'fs-'+Date.now(),year:String(new Date().getFullYear()),format:'2d',draft:true})}};$('imageFile').onchange=e=>e.target.files[0]&&upload(e.target.files[0]).catch(err=>$('notice').textContent=err.message);load().catch(e=>$('notice').textContent='Не удалось загрузить контент: '+e.message);
</script></body></html>
