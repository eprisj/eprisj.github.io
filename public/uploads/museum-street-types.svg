<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f7f6f2"/>
  <style>.s{font-family:Georgia,serif}.m{font-family:Courier New,monospace}.l{stroke:#111;stroke-width:2}.f{stroke:#111;stroke-width:1}.g{fill:#666}</style>
  <text x="80" y="92" class="s" font-size="52">Six urban settings, six different invitations</text>
  <text x="80" y="140" class="m g" font-size="20" letter-spacing="2">THE STREET MUST MATCH THE PUBLIC MISSION</text>
  <line x1="80" y1="185" x2="1520" y2="185" class="l"/>
  <g transform="translate(80 240)">
    <g><rect width="460" height="280" fill="#fff" stroke="#111"/><text x="28" y="48" class="m" font-size="17">01 / HIGH STREET</text><path d="M28 105h404M64 80v88M180 80v88M296 80v88M412 80v88" class="f"/><circle cx="112" cy="197" r="13"/><circle cx="228" cy="197" r="13"/><circle cx="344" cy="197" r="13"/><text x="28" y="250" class="s" font-size="22">Footfall + mixed routines</text></g>
    <g transform="translate(490)"><rect width="460" height="280" fill="#fff" stroke="#111"/><text x="28" y="48" class="m" font-size="17">02 / PARK EDGE</text><path d="M28 165h404M75 165q30-110 60 0M190 165q35-130 70 0M325 165q30-95 60 0" fill="none" class="f"/><text x="28" y="250" class="s" font-size="22">Slow movement + family use</text></g>
    <g transform="translate(980)"><rect width="460" height="280" fill="#fff" stroke="#111"/><text x="28" y="48" class="m" font-size="17">03 / WATERFRONT</text><path d="M28 120h404M28 150q35-25 70 0t70 0t70 0t70 0t70 0t44 0" fill="none" class="f"/><text x="28" y="250" class="s" font-size="22">Promenade + seasonal exposure</text></g>
    <g transform="translate(0 310)"><rect width="460" height="280" fill="#fff" stroke="#111"/><text x="28" y="48" class="m" font-size="17">04 / CAMPUS</text><rect x="54" y="92" width="115" height="85" fill="none" class="f"/><rect x="290" y="92" width="115" height="85" fill="none" class="f"/><path d="M169 135h121" class="f"/><text x="28" y="250" class="s" font-size="22">Repeat users + territorial risk</text></g>
    <g transform="translate(490 310)"><rect width="460" height="280" fill="#fff" stroke="#111"/><text x="28" y="48" class="m" font-size="17">05 / INDUSTRIAL FRINGE</text><path d="M38 180V95h105v85M143 180v-45h85v45M228 180V75h170v105" fill="none" class="f"/><text x="28" y="250" class="s" font-size="22">Scale + difficult spontaneity</text></g>
    <g transform="translate(980 310)"><rect width="460" height="280" fill="#111" stroke="#111"/><text x="28" y="48" class="m" fill="#fff" font-size="17">06 / TRANSIT NODE</text><path d="M230 82v115M90 140h280M160 95l70 45-70 45M300 95l-70 45 70 45" fill="none" stroke="#fff"/><text x="28" y="250" class="s" fill="#fff" font-size="22">Many bodies + little dwell time</text></g>
  </g>
  <text x="80" y="905" class="m g" font-size="17">TEST EACH SETTING FOR: CONTINUITY / DWELL / AFTER-HOURS LIFE / MORE THAN ONE REASON TO ARRIVE</text>
  <text x="1520" y="950" text-anchor="end" class="m g" font-size="16">EPRIS RESEARCH DIAGRAM 02</text>
</svg>
