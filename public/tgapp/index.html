<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>EPRIS — редакция</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Тот же язык, что на самом сайте (снято живьём с eprisjournal.com, не с
     устаревшего брендбука): чёрно-белая гамма, Crimson Text прямым
     начертанием для заголовков, тонкие 1px рамки, pill-кнопки. */
  :root {
    --ink: #111111;
    --paper: #ffffff;
    --muted: rgba(17,17,17,0.55);
    --rule: rgba(17,17,17,0.14);
    --success: #3f6b4a;
    --error: #a13b3b;
    /* Шапка на сайте всегда чёрная, в любой системной теме — это часть
       айдентики EPRIS, не то, что подстраивается под Telegram. */
    --header-bg: #111111;
    --header-fg: #ffffff;
    --tint: rgba(0,0,0,0.03);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'PT Serif', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
    transition: background .15s, color .15s;
  }
  @font-face {
    font-family: 'Crimson Text';
    src: local('Crimson Text');
    font-weight: 400 600;
  }
  .title { font-family: 'Crimson Text', 'PT Serif', serif; }
  .mono { font-family: 'PT Mono', 'PT Serif', monospace; letter-spacing: 0.06em; }

  header.bar {
    background: var(--header-bg); color: var(--header-fg);
    padding: 18px 20px; position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.bar .logo { font-family: 'PT Serif', serif; font-size: 18px; letter-spacing: 4px; }
  header.bar .right { display: flex; align-items: center; gap: 14px; }
  header.bar .tag { font-size: 10px; letter-spacing: 2px; opacity: 0.6; text-transform: uppercase; }
  header.bar .refresh { font-size: 16px; opacity: 0.75; cursor: pointer; line-height: 1; padding: 4px; }
  header.bar .refresh.spin { animation: spin 0.6s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  main { padding: 16px 16px 8px; }

  .tabs { display: flex; gap: 8px; margin: 4px 0 16px; }
  .tab {
    flex: 1; text-align: center; padding: 10px 6px; font-size: 12px;
    letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--rule);
    background: none; color: var(--muted); cursor: pointer;
  }
  .tab.active { border-color: var(--ink); color: var(--ink); }

  .stat-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat {
    flex: 1 1 30%; border: 1px solid var(--rule); padding: 12px 10px; min-width: 90px;
  }
  .stat .n { font-family: 'Crimson Text', serif; font-size: 26px; line-height: 1; }
  .stat .l { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .search {
    width: 100%; padding: 10px 0; border: none; border-bottom: 1px solid var(--ink);
    background: none; font-family: 'PT Serif', serif; font-size: 15px; color: var(--ink);
    margin-bottom: 12px; outline: none;
  }
  .search::placeholder { color: var(--muted); }

  .row {
    padding: 14px 0; border-bottom: 1px solid var(--rule);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    cursor: pointer;
  }
  .row .cat { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .row .ttl { font-family: 'Crimson Text', serif; font-size: 19px; margin-top: 2px; line-height: 1.25; }
  .row .prev {
    font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .row .badge {
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    border: 1px solid var(--ink); padding: 5px 9px; white-space: nowrap; cursor: pointer;
  }
  .row .badge.draft { color: var(--error); border-color: var(--error); }
  .row .badge.live { color: var(--success); border-color: var(--success); }
  .row .when { font-size: 10px; letter-spacing: 0.5px; color: var(--muted); white-space: nowrap; }

  .empty { color: var(--muted); padding: 30px 0; text-align: center; font-size: 14px; }

  .more-link {
    display: block; text-align: center; padding: 12px; margin-top: 4px;
    border: 1px solid var(--rule); font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--ink); cursor: pointer;
  }

  /* Та же рамка, но без uppercase/letter-spacing: та вёрстка держит короткую
     статичную метку ("ВСЕ МАТЕРИАЛЫ"), а тут — предложение с цифрами
     ("3 предстоящих, 8 контактов") — капсом оно превращалось в крик. */
  .crm-link {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-align: center; padding: 14px 12px; margin-top: 4px; border: 1px solid var(--rule);
    font-family: 'PT Serif', serif; font-size: 15px; color: var(--ink); cursor: pointer;
  }
  .crm-link .n { font-family: 'PT Mono', monospace; font-size: 13px; color: var(--muted); }

  .out-link {
    display: inline-block; margin-bottom: 16px; font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted); text-decoration: underline; cursor: pointer;
  }

  /* Редактор — отдельный экран, не модалка: Telegram Mini App и так живёт
     в отдельном окне, второй слой поверх только путает. */
  #editor { display: none; }
  #editor.open { display: block; }
  .hidden { display: none !important; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .field input[type=text], .field textarea, .field select {
    width: 100%; border: none; border-bottom: 1px solid var(--ink); padding: 8px 0;
    font-family: 'PT Serif', serif; font-size: 16px; color: var(--ink); background: none; outline: none;
    resize: vertical;
  }
  .field textarea { min-height: 70px; }

  .cover {
    width: 100%; aspect-ratio: 16/9; border: 1px solid var(--rule); margin-bottom: 16px;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
    font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    background-size: cover; background-position: center; position: relative; overflow: hidden;
  }
  .cover.has-image span { background: rgba(17,17,17,0.7); color: #fff; padding: 6px 12px; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
  .toggle-row .lbl { font-size: 14px; }
  .switch { width: 42px; height: 24px; border: 1px solid var(--ink); position: relative; cursor: pointer; flex-shrink: 0; }
  .switch .dot { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: var(--ink); transition: left .15s; }
  .switch.on .dot { left: 22px; background: var(--success); }

  /* Липнет к низу экрана — на статье в 15+ блоков «Сохранить» раньше было
     видно только домотав до самого конца, что на практике означало лишний
     повод бросить правку на середине. */
  .actions {
    display: flex; gap: 10px; margin-top: 20px; position: sticky; bottom: 0;
    background: var(--paper); padding: 12px 0 4px; border-top: 1px solid var(--rule);
  }
  .btn {
    flex: 1; border: 1px solid var(--ink); background: none; padding: 13px 10px;
    font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--ink); cursor: pointer; text-align: center;
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn:disabled { opacity: 0.4; }

  #toast {
    position: fixed; left: 16px; right: 16px; bottom: -80px; background: var(--ink); color: var(--paper);
    padding: 12px 16px; font-size: 13px; text-align: center;
    transition: bottom .2s; z-index: 50;
  }
  #toast.show { bottom: 16px; }

  .loading { text-align: center; padding: 60px 0; color: var(--muted); font-size: 13px; letter-spacing: 1px; }

  /* ── Блоки тела статьи ─────────────────────────────────────────────────── */
  .blocks-heading {
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
    margin: 24px 0 10px; padding-top: 16px; border-top: 1px solid var(--rule);
  }
  .block-card { border: 1px solid var(--rule); padding: 12px; margin-bottom: 10px; }
  .block-card.locked { background: var(--tint); }
  .block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .block-type {
    font-family: 'PT Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted);
  }
  .block-ctrls { display: flex; gap: 10px; }
  .block-ctrls span { cursor: pointer; font-size: 14px; color: var(--ink); padding: 2px 4px; user-select: none; }
  .block-ctrls span.disabled { opacity: 0.25; pointer-events: none; }
  .block-card textarea, .block-card input[type=text] {
    width: 100%; border: none; border-bottom: 1px solid var(--rule); padding: 6px 0;
    font-family: 'PT Serif', serif; font-size: 15px; color: var(--ink); background: none; outline: none; resize: vertical;
  }
  .block-card textarea { min-height: 60px; }
  .block-card select {
    border: 1px solid var(--rule); background: none; font-family: 'PT Mono', monospace; font-size: 11px;
    padding: 4px 6px; color: var(--ink);
  }
  .block-card .cap-input { margin-top: 8px; }
  .block-locked-preview { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .block-img {
    width: 100%; max-height: 160px; object-fit: cover; margin-bottom: 8px; cursor: pointer; display: block;
  }
  .add-block-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 22px; }
  .add-block-btn {
    border: 1px solid var(--ink); background: none; padding: 8px 12px; font-family: 'PT Mono', monospace;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink); cursor: pointer;
  }

  /* ── Чипы: теги, плюсы/минусы обзора ─────────────────────────────────────── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    border: 1px solid var(--ink); padding: 4px 8px 4px 10px; font-size: 12px;
    display: flex; align-items: center; gap: 6px; font-family: 'PT Serif', serif;
  }
  .chip .x { cursor: pointer; opacity: 0.55; font-size: 12px; }

  /* ── Создание материала ───────────────────────────────────────────────── */
  .new-row { display: flex; gap: 10px; margin: 4px 0 20px; }
  .new-btn {
    flex: 1; border: 1px dashed var(--ink); background: none; padding: 12px 10px;
    font-family: 'PT Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--ink); cursor: pointer; text-align: center;
  }

  /* ── Gallery-блок: редактируемая сетка миниатюр ──────────────────────────── */
  .gal-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .gal-thumb { position: relative; width: 72px; height: 72px; }
  .gal-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-thumb .x {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; background: var(--ink);
    color: var(--paper); border-radius: 50%; font-size: 11px; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }
  .gal-add {
    width: 72px; height: 72px; border: 1px dashed var(--rule); display: flex; align-items: center;
    justify-content: center; font-size: 22px; color: var(--muted); cursor: pointer;
  }

  /* ── CRM: контакты, интервью, заметки ────────────────────────────────────── */
  .crm-row {
    padding: 14px 0; border-bottom: 1px solid var(--rule); cursor: pointer;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .crm-row .ttl { font-family: 'Crimson Text', serif; font-size: 19px; line-height: 1.25; }
  .crm-row .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .status-badge {
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--ink);
    padding: 5px 9px; white-space: nowrap; flex-shrink: 0; cursor: pointer;
  }
  .status-badge.st-planned { border-color: var(--muted); color: var(--muted); }
  .status-badge.st-done { border-color: var(--success); color: var(--success); }
  .status-badge.st-transcribing { color: #b8860b; border-color: #b8860b; }
  .status-badge.st-ready { border-color: var(--success); color: var(--success); background: var(--tint); }

  .note-card { border: 1px solid var(--rule); padding: 12px; margin-bottom: 10px; position: relative; }
  .note-card textarea {
    width: 100%; border: none; background: none; font-family: 'PT Serif', serif; font-size: 15px;
    color: var(--ink); outline: none; resize: vertical; min-height: 50px;
  }
  .note-card .note-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .note-card .note-date { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }
  .note-card .note-del { font-size: 13px; color: var(--muted); cursor: pointer; }

  #crm-editor .field select {
    width: 100%; border: none; border-bottom: 1px solid var(--ink); padding: 8px 0;
    font-family: 'PT Serif', serif; font-size: 16px; color: var(--ink); background: none; outline: none;
  }
</style>
</head>
<body>

<header class="bar">
  <span class="logo">EPRIS</span>
  <span class="right">
    <span class="tag" id="who">РЕДАКЦИЯ</span>
    <span class="refresh" id="refreshBtn" title="Обновить">↻</span>
  </span>
</header>

<main>
  <div id="boot" class="loading">Проверяем доступ…</div>

  <div id="home-view" class="hidden">
    <div class="new-row">
      <button class="new-btn" id="newArticleBtn">+ Статья</button>
      <button class="new-btn" id="newReviewBtn">+ Обзор</button>
    </div>
    <div class="stat-row" id="stats"></div>
    <div class="crm-link" id="crmLink">CRM — контакты, интервью, заметки →</div>
    <div class="title" style="font-size:20px;margin:6px 0 10px;">Свежее</div>
    <div id="recent"></div>
    <div class="more-link" id="allLink">Все материалы →</div>
  </div>

  <div id="list-view" class="hidden">
    <div class="tabs">
      <button class="tab active" data-section="all">Все</button>
      <button class="tab" data-section="articles">Статьи</button>
      <button class="tab" data-section="reviews">Обзоры</button>
      <button class="tab" data-section="draft">Черновики</button>
    </div>
    <input class="search" id="search" placeholder="Поиск по заголовку…">
    <div id="rows"></div>
  </div>

  <div id="crm-view" class="hidden">
    <div class="tabs">
      <button class="tab active" data-crmtab="interviews">Интервью</button>
      <button class="tab" data-crmtab="contacts">Контакты</button>
      <button class="tab" data-crmtab="notes">Заметки</button>
    </div>
    <input class="search" id="crmSearch" placeholder="Поиск…">
    <div class="new-row" id="crmAddRow"></div>
    <div id="crmList"></div>
  </div>

  <div id="crm-editor" class="hidden">
    <div class="field" id="ce-name-wrap">
      <label id="ceNameLabel">Имя</label>
      <input type="text" id="ce-name">
    </div>
    <div class="field" id="ce-type-wrap">
      <label>Тип</label>
      <select id="ce-type">
        <option value="author">Автор</option>
        <option value="partner">Партнёр</option>
        <option value="speaker">Спикер</option>
        <option value="other">Другое</option>
      </select>
    </div>
    <div class="field" id="ce-telegram-wrap">
      <label>Telegram</label>
      <input type="text" id="ce-telegram" placeholder="@username">
    </div>
    <div class="field" id="ce-email-wrap">
      <label>Email</label>
      <input type="text" id="ce-email">
    </div>
    <div class="field" id="ce-phone-wrap">
      <label>Телефон</label>
      <input type="text" id="ce-phone">
    </div>

    <div class="field" id="ce-subject-wrap">
      <label>Тема интервью</label>
      <input type="text" id="ce-subject">
    </div>
    <div class="field" id="ce-contact-wrap">
      <label>С кем</label>
      <select id="ce-contact"></select>
    </div>
    <div class="field" id="ce-status-wrap">
      <label>Статус</label>
      <select id="ce-status">
        <option value="planned">Запланировано</option>
        <option value="done">Проведено</option>
        <option value="transcribing">Расшифровка</option>
        <option value="ready">Готово</option>
      </select>
    </div>
    <div class="field" id="ce-when-wrap">
      <label>Дата и время</label>
      <input type="datetime-local" id="ce-when">
    </div>
    <div class="field" id="ce-meet-wrap">
      <label>Ссылка на встречу</label>
      <input type="text" id="ce-meet" placeholder="https://meet.google.com/…">
    </div>

    <div class="field" id="ce-note-wrap">
      <label>Заметка</label>
      <textarea id="ce-note"></textarea>
    </div>

    <div class="actions">
      <button class="btn" id="ceDeleteBtn" style="border-color:var(--error);color:var(--error)">Удалить</button>
      <button class="btn" id="ceCancelBtn">Назад</button>
      <button class="btn primary" id="ceSaveBtn">Сохранить</button>
    </div>
  </div>

  <div id="editor">
    <div class="out-link" id="openSiteLink">Открыть на сайте ↗</div>

    <div class="toggle-row" style="margin-bottom:16px;">
      <span class="lbl" id="draftLbl">Опубликовать</span>
      <div class="switch" id="draftSwitch"><div class="dot"></div></div>
    </div>

    <div class="cover" id="cover">Нажмите, чтобы добавить обложку</div>
    <div class="out-link" id="removeCoverLink" style="display:none;margin-top:-10px;color:var(--error);">✕ Убрать обложку</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <div class="field">
      <label id="titleLabel">Заголовок</label>
      <input type="text" id="f-title">
    </div>
    <div class="field" id="f-sub-wrap">
      <label id="subLabel">Лид</label>
      <textarea id="f-sub"></textarea>
    </div>
    <div class="field" id="f-cat-wrap">
      <label>Категория</label>
      <input type="text" id="f-cat" list="catList">
      <datalist id="catList"></datalist>
    </div>
    <div class="field" id="f-date-wrap">
      <label>Дата</label>
      <input type="text" id="f-date" placeholder="July 18, 2026">
    </div>
    <div class="field" id="f-rating-wrap" style="display:none">
      <label>Оценка (0–5)</label>
      <input type="text" id="f-rating" inputmode="decimal">
    </div>

    <div class="field" id="f-tags-wrap" style="display:none">
      <label>Теги</label>
      <div class="chips" id="chips-tags"></div>
      <input type="text" id="tags-input" placeholder="Тег + Enter">
    </div>

    <div class="field" id="f-verdict-wrap" style="display:none">
      <label>Вердикт</label>
      <textarea id="f-verdict"></textarea>
    </div>
    <div class="field" id="f-pros-wrap" style="display:none">
      <label>Плюсы</label>
      <div class="chips" id="chips-pros"></div>
      <input type="text" id="pros-input" placeholder="Плюс + Enter">
    </div>
    <div class="field" id="f-cons-wrap" style="display:none">
      <label>Минусы</label>
      <div class="chips" id="chips-cons"></div>
      <input type="text" id="cons-input" placeholder="Минус + Enter">
    </div>
    <div class="field" id="f-link-wrap" style="display:none">
      <label>Ссылка</label>
      <input type="text" id="f-link" placeholder="https://…">
    </div>

    <div class="blocks-heading" id="blocksHeading">Текст материала</div>
    <div id="blocks"></div>
    <div class="add-block-row" id="addBlockRow">
      <button class="add-block-btn" data-add="text">+ Текст</button>
      <button class="add-block-btn" data-add="header">+ Заголовок</button>
      <button class="add-block-btn" data-add="quote">+ Цитата</button>
      <button class="add-block-btn" data-add="note">+ Заметка</button>
      <button class="add-block-btn" data-add="image">+ Фото</button>
    </div>

    <div class="actions">
      <button class="btn" id="cancelBtn">Назад</button>
      <button class="btn primary" id="saveBtn">Сохранить</button>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
(function () {
  "use strict";
  var API = "https://api.eprisjournal.com";
  var tgw = window.Telegram && window.Telegram.WebApp;
  var ADMIN_PW = null;
  var content = null;
  var flatList = [];      // { section, kind, entity }
  var current = null;     // сущность в редакторе сейчас
  var activeSection = "all";
  var editorReturnView = "home";   // куда вернуться из редактора: "home" | "list"

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s); }

  function toast(msg, isError) {
    var el = $("toast");
    el.textContent = msg;
    el.style.background = isError ? "#a13b3b" : "#111111";
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  function haptic(kind) {
    try { tgw && tgw.HapticFeedback && tgw.HapticFeedback.notificationOccurred(kind || "success"); } catch (e) {}
  }

  /* ── Сеть с таймаутом ─────────────────────────────────────────────────────
   * Голый fetch без таймаута — это «Сохраняю…» до конца времён, если ответ
   * не пришёл: полузакрытый Telegram (свёрнутый в фон, половинчатый лист на
   * iOS) регулярно держит соединение подвешенным вместо явной ошибки. */
  function fetchJSON(url, opts, timeoutMs) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeoutMs || 12000);
    return fetch(url, Object.assign({}, opts, { signal: controller.signal }))
      .then(function (res) {
        return res.json().catch(function () { return null; }).then(function (data) {
          return { status: res.status, ok: res.ok, data: data };
        });
      })
      .catch(function (e) {
        if (e.name === "AbortError") throw new Error("нет ответа — таймаут");
        throw new Error("нет сети: " + e.message);
      })
      .finally(function () { clearTimeout(timer); });
  }

  var bootedAt = 0;

  // ── Тема: сайт не подстраивается под тёмный режим системы, и панель ──────
  // тоже не должна. Раньше здесь была инверсия палитры под tgw.colorScheme —
  // выглядела как généric-приложение, а не как EPRIS: сам сайт всегда белый
  // с чёрной шапкой независимо от темы устройства, эта страница — тоже.
  // Фон ЗА пределами контента (овербаунс, нижняя панель Telegram) красится
  // в белый явно: без этого Telegram иногда красит его в свой тёмный тон,
  // даже когда сама страница светлая — на половинчатом/свёрнутом состоянии
  // эта полоса особенно заметна.
  function syncTheme() {
    try { tgw.setBackgroundColor && tgw.setBackgroundColor("#ffffff"); } catch (e) {}
    try { tgw.setBottomBarColor && tgw.setBottomBarColor("#ffffff"); } catch (e) {}
  }

  // ── Инициализация: подтверждаем, что это правда открыто из бота EPRIS ─────
  async function boot() {
    if (!tgw || !tgw.initData) {
      $("boot").innerHTML = "Открой это через кнопку бота в Telegram — вне приложения initData пуст.";
      return;
    }
    tgw.ready();
    tgw.expand();
    try { tgw.setHeaderColor && tgw.setHeaderColor("#111111"); } catch (e) {}
    syncTheme();
    // На Android человек может утащить половинчатый лист обратно вниз
    // жестом прямо во время работы — expand() при открытии этого не ловит,
    // а isExpanded после жеста становится false. Возвращаем сами.
    if (tgw.onEvent) {
      try {
        tgw.onEvent("viewportChanged", function () {
          if (tgw.isExpanded === false) tgw.expand();
        });
      } catch (e) {}
    }

    $("boot").classList.remove("hidden");
    $("boot").textContent = "Проверяем доступ…";
    $("home-view").classList.add("hidden");

    try {
      var authRes = await fetchJSON(API + "/telegram/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: tgw.initData }),
      });
      if (!authRes.data || !authRes.data.ok) throw new Error((authRes.data && authRes.data.error) || "HTTP " + authRes.status);
      ADMIN_PW = authRes.data.password;
      if (authRes.data.name) $("who").textContent = authRes.data.name.toUpperCase();

      await loadContent();
    } catch (e) {
      showBootError(e.message);
      return;
    }
    // CRM — отдельно и не блокируя открытие: документ маленький, но если
    // /crm сейчас недоступен, это не повод держать человека на экране
    // загрузки — статьи и обзоры важнее, CRM подгрузится по факту открытия.
    loadCrm().then(function () { updateCrmLinkCount(); }).catch(function () {});

    bootedAt = Date.now();
    $("boot").classList.add("hidden");
    tgw.BackButton && tgw.BackButton.onClick(goBack);

    // Диплинк из бота: кнопка "📱" под черновиком открывает Mini App с
    // ?open=section-id — сразу в редакторе этого материала, а не с
    // дашборда. Хвостом query-строку не оставляем: если человек потом
    // потянет за ↻ обновить, второй заход не должен снова дёргать editor.
    var openParam = new URLSearchParams(location.search).get("open");
    var deepLinked = false;
    if (openParam) {
      var m = /^(articles|reviews)-(\d+)$/.exec(openParam);
      if (m) {
        var item = flatList.find(function (x) { return x.section === m[1] && String(x.entity.id) === m[2]; });
        if (item) { fillEditor(item); deepLinked = true; }
      }
      history.replaceState(null, "", location.pathname);
    }
    if (!deepLinked) {
      $("home-view").classList.remove("hidden");
      renderHome();
    }
  }

  function showBootError(message) {
    var boot = $("boot");
    boot.innerHTML = "";
    var p = document.createElement("div");
    p.textContent = "Не удалось открыть панель: " + message;
    var btn = document.createElement("div");
    btn.className = "add-block-btn";
    btn.style.cssText = "display:inline-block;margin-top:16px;";
    btn.textContent = "Повторить";
    btn.onclick = boot;
    boot.appendChild(p);
    boot.appendChild(btn);
  }

  async function loadContent() {
    var res = await fetchJSON(API + "/content", { cache: "no-store" });
    if (!res.ok || !res.data) throw new Error("контент недоступен (HTTP " + res.status + ")");
    content = res.data;
    flatList = [];
    ["articles", "reviews"].forEach(function (section) {
      var kind = section === "articles" ? "статья" : "обзор";
      (content[section] || []).forEach(function (entity) {
        flatList.push({ section: section, kind: kind, entity: entity });
      });
    });
    flatList.sort(function (a, b) {
      return String(b.entity.updatedAt || b.entity.date || "").localeCompare(String(a.entity.updatedAt || a.entity.date || ""));
    });

    // Автоподсказка категорий из того, что уже реально использовалось —
    // не справочник, который можно рассинхронизировать, а живой список:
    // обновляется при каждой загрузке контента.
    var cats = Array.from(new Set(flatList.map(function (x) { return x.entity.category; }).filter(Boolean))).sort();
    $("catList").innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join("");
  }

  // ── Дашборд ────────────────────────────────────────────────────────────────
  function renderHome() {
    var drafts = flatList.filter(function (x) { return x.entity.draft; });
    var published = flatList.filter(function (x) { return !x.entity.draft; });
    $("stats").innerHTML = [
      stat(published.length, "опубл."),
      stat(drafts.length, "черновиков"),
      stat((content.items || []).length, "в галерее"),
    ].join("");
    var statEls = $("stats").querySelectorAll(".stat");
    statEls[0].onclick = function () { openList("all"); };
    statEls[0].style.cursor = "pointer";
    statEls[1].onclick = function () { openList("draft"); };
    statEls[1].style.cursor = "pointer";

    var recent = published.slice(0, 6);
    $("recent").innerHTML = recent.length
      ? recent.map(rowHtml).join("")
      : '<div class="empty">Пока пусто</div>';
    bindRows($("recent"));
  }

  function stat(n, label) {
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + esc(label) + '</div></div>';
  }

  // ── Список ────────────────────────────────────────────────────────────────
  function openList(section) {
    activeSection = section || "all";
    $("home-view").classList.add("hidden");
    $("list-view").classList.remove("hidden");
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.dataset.section === activeSection);
    });
    renderList();
    tgw && tgw.BackButton && tgw.BackButton.show();
  }

  function renderList() {
    var q = ($("search").value || "").trim().toLowerCase();
    var items = flatList.filter(function (x) {
      if (activeSection === "articles" && x.section !== "articles") return false;
      if (activeSection === "reviews" && x.section !== "reviews") return false;
      if (activeSection === "draft" && !x.entity.draft) return false;
      if (q && !(x.entity.title || "").toLowerCase().includes(q)) return false;
      return true;
    });
    $("rows").innerHTML = items.length ? items.map(rowHtml).join("") : '<div class="empty">Ничего не найдено</div>';
    bindRows($("rows"));
  }

  // updatedAt — ISO ("2026-08-20T11:37:40Z"), первые 10 символов — ровно
  // YYYY-MM-DD, слайс безопасен. date у статей — человеческий формат
  // ("July 18, 2026" / "Jul 8, 2026"), и тот же слайс на 10 символов резал
  // его посреди слова ("Jul 8, 202"). ISO отличаем по дефисам на местах
  // года-месяца-дня; всё остальное показываем как есть.
  function shortDate(v) {
    var s = String(v || "");
    if (!s) return "";
    return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : s;
  }

  function rowHtml(x) {
    var e = x.entity;
    // Бейдж — не просто статус, а кнопка: тап публикует/снимает с публикации
    // без похода в редактор. Раньше это было можно сделать только открыв
    // материал и докрутив до тумблера внизу — на статью с длинным телом
    // это лишние секунды ради одного действия.
    var badge = e.draft
      ? '<span class="badge draft" data-act="togglepub">черновик</span>'
      : '<span class="badge live" data-act="togglepub">live</span>';
    var preview = (x.section === "reviews" ? e.subject : e.excerpt) || "";
    var when = shortDate(e.updatedAt || e.date);
    return '<div class="row" data-section="' + x.section + '" data-id="' + e.id + '">' +
      '<div><div class="cat">' + esc((e.category || x.kind).toUpperCase()) + '</div>' +
      '<div class="ttl">' + esc(e.title || "без названия") + '</div>' +
      (preview ? '<div class="prev">' + esc(preview) + '</div>' : '') + '</div>' +
      '<div class="side">' + badge + (when ? '<span class="when">' + esc(when) + '</span>' : '') + '</div></div>';
  }

  function bindRows(container) {
    container.querySelectorAll(".row").forEach(function (row) {
      row.onclick = function (ev) {
        if (ev.target.closest('[data-act="togglepub"]')) return;   // обработано ниже отдельно
        openEditor(row.dataset.section, Number(row.dataset.id));
      };
    });
    container.querySelectorAll('[data-act="togglepub"]').forEach(function (badge) {
      badge.onclick = function (ev) {
        ev.stopPropagation();
        quickTogglePublish(badge.closest(".row").dataset.section, Number(badge.closest(".row").dataset.id), badge);
      };
    });
  }

  // ── Публикация в один тап, без открытия редактора ───────────────────────
  async function quickTogglePublish(section, id, badgeEl) {
    var item = flatList.find(function (x) { return x.section === section && x.entity.id === id; });
    if (!item) return;
    var wasDraft = !!item.entity.draft;
    badgeEl.textContent = "…";
    try {
      var metaRes = await fetchJSON(API + "/content/meta", { cache: "no-store" });
      if (!metaRes.data || !metaRes.data.ok) throw new Error("нет версии контента");
      var next = Object.assign({}, item.entity, { draft: !wasDraft });
      var patchRes = await fetchJSON(API + "/content/entity", {
        method: "PATCH",
        headers: { "Content-Type": "application/json", "X-Admin-Password": ADMIN_PW },
        body: JSON.stringify({ section: section, id: id, entity: next, expectedVersion: metaRes.data.version }),
      });
      if (patchRes.status === 409) { toast("Изменили в другом месте — обновите (↻) и повторите", true); await loadContent(); renderList(); renderHome(); return; }
      if (!patchRes.data || !patchRes.data.ok) throw new Error((patchRes.data && patchRes.data.error) || "HTTP " + patchRes.status);
      item.entity = next;
      haptic("success");
      toast(wasDraft ? "Опубликовано" : "Снято с публикации");
      renderList();
      if (!$("home-view").classList.contains("hidden")) renderHome();
    } catch (e) {
      toast("Ошибка: " + e.message, true);
      badgeEl.textContent = wasDraft ? "черновик" : "live";
    }
  }

  // ── Незасохранённые правки: не терять их молча ────────────────────────────
  // Полузакрытый Telegram (свайп вниз на половинчатом листе, переключение
  // на другой чат) может закрыть Mini App в любой момент — closingConfirmation
  // просит Telegram самому спросить «точно закрыть», а свой Back переспрашивает,
  // если правки ещё не сохранены.
  var isDirty = false;
  function setDirty(v) {
    isDirty = v;
    try {
      if (!tgw) return;
      if (v && tgw.enableClosingConfirmation) tgw.enableClosingConfirmation();
      else if (!v && tgw.disableClosingConfirmation) tgw.disableClosingConfirmation();
    } catch (e) { /* старый клиент без этого API — не критично */ }
  }

  function confirmDiscard(action) {
    if (!isDirty) { action(); return; }
    if (tgw && tgw.showConfirm) {
      tgw.showConfirm("Есть несохранённые правки. Закрыть без сохранения?", function (confirmed) {
        if (confirmed) action();
      });
    } else if (window.confirm("Есть несохранённые правки. Закрыть без сохранения?")) {
      action();
    }
  }

  function goBack() {
    if ($("editor").classList.contains("open")) { confirmDiscard(closeEditor); return; }
    if (!$("crm-editor").classList.contains("hidden")) { confirmDiscard(closeCrmEditor); return; }
    if (!$("crm-view").classList.contains("hidden")) {
      $("crm-view").classList.add("hidden");
      $("home-view").classList.remove("hidden");
      tgw && tgw.BackButton && tgw.BackButton.hide();
      return;
    }
    if (!$("list-view").classList.contains("hidden")) {
      $("list-view").classList.add("hidden");
      $("home-view").classList.remove("hidden");
      tgw && tgw.BackButton && tgw.BackButton.hide();
      return;
    }
  }

  // ── Редактор ──────────────────────────────────────────────────────────────
  function openEditor(section, id) {
    var item = flatList.find(function (x) { return x.section === section && x.entity.id === id; });
    if (!item) return;
    fillEditor(item);
  }

  // ── Создание материала с нуля ────────────────────────────────────────────
  function nextId(section) {
    var max = 0;
    flatList.forEach(function (x) { if (x.section === section) max = Math.max(max, Number(x.entity.id) || 0); });
    return max + 1;
  }

  function openCreate(section) {
    var isReview = section === "reviews";
    var id = nextId(section);
    var who = (tgw && tgw.initDataUnsafe && tgw.initDataUnsafe.user && tgw.initDataUnsafe.user.first_name) || "EPRIS Journal";
    var entity = isReview
      ? { id: id, title: "", subject: "", rating: 0, content: [], author: who, draft: true }
      : { id: id, title: "", author: who, date: new Date().toISOString().slice(0, 10), excerpt: "", category: "", imageSeed: "", tags: [], content: [], draft: true };
    fillEditor({ section: section, kind: isReview ? "обзор" : "статья", entity: entity, isNew: true });
  }

  function fillEditor(item) {
    current = item;
    var e = item.entity;
    var isReview = item.section === "reviews";

    $("titleLabel").textContent = (item.isNew ? "Новый: " : "") + (isReview ? "заголовок обзора" : "заголовок статьи");
    $("f-title").value = e.title || "";
    $("subLabel").textContent = isReview ? "Тема" : "Лид";
    $("f-sub").value = (isReview ? e.subject : e.excerpt) || "";
    autoGrow($("f-sub"));
    $("f-cat-wrap").style.display = "";
    $("f-cat").value = e.category || "";
    $("f-date").value = e.date || "";
    $("f-rating-wrap").style.display = isReview ? "" : "none";
    $("f-rating").value = isReview && e.rating != null ? String(e.rating) : "";

    $("f-tags-wrap").style.display = isReview ? "none" : "";
    chipLists.tags = Array.isArray(e.tags) ? e.tags.slice() : [];
    renderChips("tags");

    $("f-verdict-wrap").style.display = isReview ? "" : "none";
    $("f-verdict").value = e.verdict || "";
    $("f-pros-wrap").style.display = isReview ? "" : "none";
    chipLists.pros = Array.isArray(e.pros) ? e.pros.slice() : [];
    renderChips("pros");
    $("f-cons-wrap").style.display = isReview ? "" : "none";
    chipLists.cons = Array.isArray(e.cons) ? e.cons.slice() : [];
    renderChips("cons");
    $("f-link-wrap").style.display = isReview ? "" : "none";
    $("f-link").value = e.link || "";

    $("openSiteLink").style.display = item.isNew ? "none" : "";

    var cover = $("cover");
    if (e.imageUrl) {
      cover.style.backgroundImage = "url(" + e.imageUrl + ")";
      cover.classList.add("has-image");
      cover.innerHTML = "<span>Заменить обложку</span>";
      $("removeCoverLink").style.display = "";
    } else {
      cover.style.backgroundImage = "";
      cover.classList.remove("has-image");
      cover.textContent = "Нажмите, чтобы добавить обложку";
      $("removeCoverLink").style.display = "none";
    }

    setSwitch(!e.draft);

    // Рабочая копия тела статьи: строку (у части обзоров content — просто
    // текст) заворачиваем в один текстовый блок, остальное клонируем, чтобы
    // правки в редакторе не текли обратно в flatList до явного сохранения.
    var rawContent = e.content;
    if (typeof rawContent === "string") blockList = rawContent ? [{ type: "text", content: rawContent }] : [];
    else if (Array.isArray(rawContent)) blockList = JSON.parse(JSON.stringify(rawContent));
    else blockList = [];
    renderBlocks();

    editorReturnView = $("list-view").classList.contains("hidden") ? "home" : "list";
    $("home-view").classList.add("hidden");
    $("list-view").classList.add("hidden");
    $("editor").classList.add("open");
    $("editor").scrollTop = 0;
    tgw && tgw.BackButton && tgw.BackButton.show();
    setDirty(false);   // поля только что заполнены кодом, это не правка пользователя

    // Пересчёт высоты — ПОСЛЕ того, как редактор стал видимым. renderBlocks()
    // выше вызывался, пока #editor ещё display:none, а scrollHeight скрытого
    // элемента всегда 0 — textarea сжимались до min-height и обрезали текст
    // до первого нажатия клавиши.
    $("editor").querySelectorAll("textarea").forEach(function (ta) { autoGrow(ta); });
  }

  // Любая правка внутри редактора — набор текста, чекбоксы, блоки — считается
  // несохранённой. Один делегированный слушатель проще, чем помечать дюжину
  // мест по отдельности, и не пропустит новое поле, если его позже добавят.
  // "input" одного недостаточно: <select> и datetime-local в части WebView
  // (Telegram на Android регулярно) поднимают только "change" — на них
  // правка молча не помечалась несохранённой, и закрытие без запроса
  // теряло, например, смену категории или переключение публикации.
  $("editor").addEventListener("input", function () { setDirty(true); });
  $("editor").addEventListener("change", function () { setDirty(true); });

  // Текстовые поля растут вместе с текстом вместо ручного перетаскивания
  // уголка — на теле статьи, которое легко разрастается на десятки строк,
  // таскать resize-хендл после каждого абзаца утомляет быстрее, чем сам
  // набор текста.
  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  $("editor").addEventListener("input", function (ev) {
    if (ev.target.tagName === "TEXTAREA") autoGrow(ev.target);
  });
  $("editor").addEventListener("click", function (ev) {
    if (ev.target.closest("#cancelBtn, #saveBtn, #openSiteLink")) return;
    setDirty(true);
  });

  function closeEditor() {
    $("editor").classList.remove("open");
    current = null;
    blockList = [];
    setDirty(false);
    // Куда возвращаться, решили ДО открытия редактора (editorReturnView) —
    // не по тому, есть ли на странице .row: они остаются в DOM и на скрытом
    // home-view («Свежее» использует тот же класс), так что подсчёт всегда
    // находил хоть одну строку и уводил обратно в список, даже если открыли
    // материал прямо с дашборда.
    if (editorReturnView === "list") {
      $("list-view").classList.remove("hidden");
    } else {
      $("home-view").classList.remove("hidden");
      tgw && tgw.BackButton && tgw.BackButton.hide();
    }
  }

  // ── Блоки тела статьи ────────────────────────────────────────────────────
  // Полная широта типов блоков (12 штук) редактируется в самой веб-панели.
  // Здесь — те, что составляют подавляющее большинство текста материалов:
  // текст/заголовок/цитата/заметка/фото. Остальные (галерея, мозаика, карта,
  // чек-лист, опрос, видео, ссылка) показываются как есть, без редактора —
  // тронуть их структуру с телефона слишком легко сломать, а посмотреть
  // и переставить всё равно можно.
  var EDITABLE_TEXT = { text: "Текст", quote: "Цитата", note: "Заметка" };
  var blockList = [];
  var photoTarget = "cover";   // "cover" | номер блока | {i, gallery:true} — куда положить следующее загруженное фото

  // ── Чипы: теги статьи, плюсы/минусы обзора ──────────────────────────────
  var chipLists = { tags: [], pros: [], cons: [] };
  function renderChips(key) {
    $("chips-" + key).innerHTML = chipLists[key].map(function (v, i) {
      return '<span class="chip">' + esc(v) + '<span class="x" data-chipdel="' + key + '" data-i="' + i + '">✕</span></span>';
    }).join("");
  }
  ["tags", "pros", "cons"].forEach(function (key) {
    $("chips-" + key).addEventListener("click", function (ev) {
      var t = ev.target.closest("[data-chipdel]");
      if (!t) return;
      chipLists[key].splice(Number(t.dataset.i), 1);
      renderChips(key);
    });
    $(key + "-input").addEventListener("keydown", function (ev) {
      // Запятая — так же естественно, как Enter, когда перечисляешь теги
      // подряд: не у всех клавиатур Enter на телефоне ведёт себя одинаково
      // (иногда «Готово», иногда перевод строки), а запятая — всегда запятая.
      if (ev.key !== "Enter" && ev.key !== ",") return;
      ev.preventDefault();
      var v = this.value.trim();
      if (!v) return;
      chipLists[key].push(v);
      this.value = "";
      renderChips(key);
    });
  });

  function blockPreview(b) {
    var val = b.content;
    if (Array.isArray(val)) return val.length + " элем.";
    if (val && typeof val === "object") return Object.keys(val).slice(0, 3).join(", ");
    return esc(String(val || "")).slice(0, 100);
  }

  function blockCardHtml(b, i) {
    var head = '<div class="block-head"><span class="block-type">' + esc(b.type) + '</span>' +
      '<div class="block-ctrls">' +
      '<span data-act="up" data-i="' + i + '" class="' + (i === 0 ? "disabled" : "") + '">↑</span>' +
      '<span data-act="down" data-i="' + i + '" class="' + (i === blockList.length - 1 ? "disabled" : "") + '">↓</span>' +
      '<span data-act="del" data-i="' + i + '">✕</span></div></div>';

    if (EDITABLE_TEXT[b.type]) {
      return '<div class="block-card" data-i="' + i + '">' + head +
        '<textarea data-field="content" data-i="' + i + '">' + esc(b.content) + '</textarea></div>';
    }
    if (b.type === "header") {
      return '<div class="block-card" data-i="' + i + '">' + head +
        '<textarea data-field="content" data-i="' + i + '">' + esc(b.content) + '</textarea>' +
        '<div style="margin-top:8px"><select data-field="level" data-i="' + i + '">' +
        [1, 2, 3, 4].map(function (n) { return '<option value="' + n + '"' + (String(b.level) === String(n) ? " selected" : "") + '>H' + n + '</option>'; }).join("") +
        '</select></div></div>';
    }
    if (b.type === "image") {
      var img = typeof b.content === "string" && b.content ? b.content : "";
      return '<div class="block-card" data-i="' + i + '">' + head +
        (img ? '<img class="block-img" src="' + esc(img) + '" data-act="pickimg" data-i="' + i + '">' : '<div class="add-block-btn" data-act="pickimg" data-i="' + i + '" style="margin-bottom:8px;display:inline-block">Загрузить фото</div>') +
        '<input type="text" class="cap-input" placeholder="Подпись" data-field="caption" data-i="' + i + '" value="' + esc(b.caption || "") + '"></div>';
    }
    if (b.type === "gallery") {
      var imgs = Array.isArray(b.content) ? b.content : [];
      var thumbs = imgs.map(function (url, gi) {
        return '<div class="gal-thumb"><img src="' + esc(url) + '">' +
          '<span class="x" data-act="galdel" data-i="' + i + '" data-gi="' + gi + '">✕</span></div>';
      }).join("");
      return '<div class="block-card" data-i="' + i + '">' + head +
        '<div class="gal-grid">' + thumbs + '<div class="gal-add" data-act="galadd" data-i="' + i + '">+</div></div>' +
        '<input type="text" class="cap-input" placeholder="Подпись" data-field="caption" data-i="' + i + '" value="' + esc(b.caption || "") + '"></div>';
    }
    return '<div class="block-card locked" data-i="' + i + '">' + head +
      '<div class="block-locked-preview">' + blockPreview(b) + '<br><i>правится в панели на сайте</i></div></div>';
  }

  function renderBlocks() {
    $("blocksHeading").textContent = "Текст материала" + (blockList.length ? " — " + blockList.length : "");
    $("blocks").innerHTML = blockList.length
      ? blockList.map(blockCardHtml).join("")
      : '<div class="empty">Пусто — добавьте блок ниже</div>';
    // Существующий текст блока может быть длиннее исходной высоты textarea —
    // без этого прохода длинные абзацы открывались бы обрезанными до первого
    // ввода символа.
    $("blocks").querySelectorAll("textarea").forEach(function (ta) { autoGrow(ta); });
  }

  $("blocks").addEventListener("input", function (ev) {
    var t = ev.target;
    var i = Number(t.dataset.i);
    var field = t.dataset.field;
    if (!field || !blockList[i]) return;
    blockList[i][field] = t.value;
  });

  $("blocks").addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var i = Number(t.dataset.i);
    var act = t.dataset.act;
    if (act === "up" && i > 0) { var a = blockList.splice(i, 1)[0]; blockList.splice(i - 1, 0, a); renderBlocks(); }
    else if (act === "down" && i < blockList.length - 1) { var b = blockList.splice(i, 1)[0]; blockList.splice(i + 1, 0, b); renderBlocks(); }
    else if (act === "del") {
      // Пустой блок (только что добавленный, ничего не потерять) удаляется
      // сразу. Всё остальное — с подтверждением: отмены "✕" нет, а текст
      // внутри блока мог быть на несколько абзацев.
      var block = blockList[i];
      var hasContent = block && (Array.isArray(block.content) ? block.content.length : String(block.content || "").trim());
      var doDel = function () { blockList.splice(i, 1); renderBlocks(); setDirty(true); };
      if (!hasContent) { doDel(); }
      else if (tgw && tgw.showConfirm) tgw.showConfirm("Удалить блок без возможности отмены?", function (ok) { if (ok) doDel(); });
      else if (window.confirm("Удалить блок без возможности отмены?")) doDel();
    }
    else if (act === "pickimg") { photoTarget = i; $("fileInput").click(); }
    else if (act === "galadd") { photoTarget = { i: i, gallery: true }; $("fileInput").click(); }
    else if (act === "galdel") {
      var gi = Number(t.dataset.gi);
      var blk = blockList[i];
      if (blk && Array.isArray(blk.content)) { blk.content.splice(gi, 1); renderBlocks(); }
    }
  });

  $("addBlockRow").addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-add]");
    if (!t) return;
    var type = t.dataset.add;
    var block = type === "header" ? { type: "header", level: "2", content: "" }
      : type === "image" ? { type: "image", content: "", caption: "" }
      : { type: type, content: "" };
    blockList.push(block);
    renderBlocks();
    haptic();
  });

  function setSwitch(on) {
    $("draftSwitch").classList.toggle("on", on);
    $("draftSwitch").dataset.on = on ? "1" : "0";
    // Подпись — не статус «опубликовано: да/нет», а действие, которое
    // произойдёт при сохранении: жалоба была именно на то, что кнопку
    // публикации не удавалось найти среди полей формы.
    $("draftLbl").textContent = on ? "Опубликовано — снять с публикации?" : "Опубликовать";
  }

  $("draftSwitch").onclick = function () { setSwitch($("draftSwitch").dataset.on !== "1"); haptic(); };
  $("cancelBtn").onclick = goBack;

  $("cover").onclick = function () { photoTarget = "cover"; $("fileInput").click(); };
  $("removeCoverLink").onclick = function (ev) {
    ev.stopPropagation();
    if (!current) return;
    current.entity.imageUrl = "";
    var cover = $("cover");
    cover.style.backgroundImage = "";
    cover.classList.remove("has-image");
    cover.textContent = "Нажмите, чтобы добавить обложку";
    $("removeCoverLink").style.display = "none";
    setDirty(true);
  };
  $("fileInput").onchange = async function () {
    var file = this.files && this.files[0];
    this.value = "";   // иначе повторный выбор того же файла не поднимет onchange
    if (!file || !current) return;
    var target = photoTarget;
    var cover = target === "cover" ? $("cover") : null;
    if (cover) { cover.textContent = "Загрузка…"; cover.classList.remove("has-image"); }
    else toast("Загрузка фото…");
    try {
      var b64 = await fileToBase64(file);
      // Фото весит больше обычного JSON-ответа — таймаут просторнее, чтобы
      // мобильная загрузка не обрывалась на полпути.
      var res = await fetchJSON(API + "/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Password": ADMIN_PW },
        body: JSON.stringify({ data: b64, contentType: file.type || "image/jpeg", filename: file.name || "photo.jpg" }),
      }, 45000);
      var data = res.data;
      if (!data || !data.ok) throw new Error((data && data.error) || "HTTP " + res.status);
      setDirty(true);
      if (target === "cover") {
        current.entity.imageUrl = data.url;
        cover.style.backgroundImage = "url(" + data.url + ")";
        cover.classList.add("has-image");
        cover.innerHTML = "<span>Заменить обложку</span>";
        $("removeCoverLink").style.display = "";
      } else if (target && typeof target === "object" && target.gallery) {
        var galBlock = blockList[target.i];
        if (galBlock) {
          if (!Array.isArray(galBlock.content)) galBlock.content = [];
          galBlock.content.push(data.url);
          renderBlocks();
        }
      } else if (blockList[target]) {
        blockList[target].content = data.url;
        renderBlocks();
      }
      toast("Фото загружено");
    } catch (e) {
      if (cover) cover.textContent = "Не удалось загрузить — нажмите ещё раз";
      toast(e.message, true);
    }
  };

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result).split(",")[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  $("saveBtn").onclick = async function () {
    if (!current) return;
    var btn = $("saveBtn");
    btn.disabled = true;
    btn.textContent = "Сохраняю…";
    try {
      var isReview = current.section === "reviews";
      var next = Object.assign({}, current.entity);
      next.title = $("f-title").value.trim();
      if (!next.title) throw new Error("заголовок не может быть пустым");
      if (isReview) {
        next.subject = $("f-sub").value.trim();
        var r = parseFloat($("f-rating").value.replace(",", "."));
        if (!Number.isNaN(r)) next.rating = Math.max(0, Math.min(5, r));
        next.verdict = $("f-verdict").value.trim();
        next.pros = chipLists.pros.slice();
        next.cons = chipLists.cons.slice();
        next.link = $("f-link").value.trim();
      } else {
        next.excerpt = $("f-sub").value.trim();
        next.tags = chipLists.tags.slice();
      }
      next.category = $("f-cat").value.trim();
      next.date = $("f-date").value.trim();
      next.draft = $("draftSwitch").dataset.on !== "1";
      next.content = blockList;

      var metaRes = await fetchJSON(API + "/content/meta", { cache: "no-store" });
      if (!metaRes.data || !metaRes.data.ok) throw new Error("не удалось получить версию контента");

      var patchRes = await fetchJSON(API + "/content/entity", {
        method: "PATCH",
        headers: { "Content-Type": "application/json", "X-Admin-Password": ADMIN_PW },
        body: JSON.stringify({ section: current.section, id: next.id, entity: next, expectedVersion: metaRes.data.version }),
      });

      // 409 — кто-то (панель или другой редактор) сохранил материал, пока
      // мы правили. Молча перезаписывать поверх нельзя — это стёрло бы
      // чужую правку. Разложить конфликт по полям тоже некуда: проще
      // отдать выбор человеку, а не гадать самим.
      if (patchRes.status === 409) {
        if (tgw && tgw.showConfirm) {
          tgw.showConfirm("Материал изменили в другом месте, пока вы правили. Обновить данные? Свои правки придётся внести заново.", function (confirmed) {
            if (confirmed) { setDirty(false); loadContent().then(function () { toast("Обновлено — правки утеряны, начните заново"); goBack(); }); }
          });
        } else {
          toast("Материал изменили в другом месте — обновите /digest и повторите правку", true);
        }
        return;
      }
      if (!patchRes.data || !patchRes.data.ok) throw new Error((patchRes.data && patchRes.data.error) || "HTTP " + patchRes.status);

      current.entity = next;
      setDirty(false);
      await loadContent();
      renderHome();
      toast("Сохранено");
      haptic("success");
      goBack();
    } catch (e) {
      toast("Ошибка: " + e.message, true);
      haptic("error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Сохранить";
    }
  };

  // Скоуп к #list-view намеренно: у #crm-view свои .tab с data-crmtab,
  // общий querySelectorAll(".tab") зацепил бы и их тоже.
  document.querySelectorAll("#list-view .tab").forEach(function (tab) {
    tab.onclick = function () { openList(tab.dataset.section); };
  });
  $("search").oninput = renderList;
  $("allLink").onclick = function () { openList("all"); };
  $("newArticleBtn").onclick = function () { openCreate("articles"); };
  $("newReviewBtn").onclick = function () { openCreate("reviews"); };

  // ══════════════════════════════════════════════════════════════════════
  // CRM: контакты, интервью, заметки — отдельный документ (/crm), не связан
  // с публичным контентом сайта. Тот же паттерн read-modify-write целиком,
  // что и раньше для content, но без версионирования: документ маленький,
  // редактор один, конфликт почти невероятен, а версионирование на его
  // месте — сложность без реальной пользы.
  // ══════════════════════════════════════════════════════════════════════

  var crm = { contacts: [], interviews: [], notes: [] };
  var crmLoaded = false;
  var crmActiveTab = "interviews";
  var crmCurrent = null;   // { kind: "contact"|"interview", entity }

  async function loadCrm() {
    var res = await fetchJSON(API + "/crm", { headers: { "X-Admin-Password": ADMIN_PW }, cache: "no-store" });
    if (!res.data || !res.data.ok) throw new Error("CRM недоступна (HTTP " + res.status + ")");
    crm = { contacts: res.data.contacts || [], interviews: res.data.interviews || [], notes: res.data.notes || [] };
    crmLoaded = true;
  }

  // Кнопка на дашборде показывает реальные числа вместо общей подписи —
  // не нужно заходить внутрь, чтобы понять, пусто там или нет.
  function updateCrmLinkCount() {
    var upcoming = crm.interviews.filter(function (iv) { return iv.status === "planned"; }).length;
    var bits = [upcoming + " интервью", crm.contacts.length + " контактов", crm.notes.length + " заметок"];
    $("crmLink").innerHTML = "CRM<span class=\"n\">&nbsp;&nbsp;" + esc(bits.join("  ·  ")) + "</span>&nbsp;&nbsp;→";
  }

  async function saveCrm() {
    var res = await fetchJSON(API + "/crm", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Password": ADMIN_PW },
      body: JSON.stringify(crm),
    });
    if (!res.data || !res.data.ok) throw new Error((res.data && res.data.error) || "HTTP " + res.status);
    updateCrmLinkCount();
  }

  function contactName(id) {
    var c = crm.contacts.find(function (x) { return String(x.id) === String(id); });
    return c ? c.name : "—";
  }

  var STATUS_LABEL = { planned: "Запланировано", done: "Проведено", transcribing: "Расшифровка", ready: "Готово" };

  async function openCrm(tab) {
    if (!crmLoaded) {
      try { await loadCrm(); } catch (e) { toast("Не удалось загрузить CRM: " + e.message, true); return; }
    }
    updateCrmLinkCount();
    crmActiveTab = tab || crmActiveTab;
    $("home-view").classList.add("hidden");
    $("crm-view").classList.remove("hidden");
    document.querySelectorAll("#crm-view .tab").forEach(function (t) {
      t.classList.toggle("active", t.dataset.crmtab === crmActiveTab);
    });
    renderCrmList();
    tgw && tgw.BackButton && tgw.BackButton.show();
  }

  document.querySelectorAll("#crm-view .tab").forEach(function (tab) {
    tab.onclick = function () { $("crmSearch").value = ""; openCrm(tab.dataset.crmtab); };
  });
  $("crmLink").onclick = function () { openCrm(); };
  $("crmSearch").oninput = renderCrmList;

  function renderCrmList() {
    if (crmActiveTab === "notes") { renderNotes(); return; }
    if (crmActiveTab === "contacts") { renderContacts(); return; }
    renderInterviews();
  }

  // ── Контакты ─────────────────────────────────────────────────────────────
  function crmQuery() { return ($("crmSearch").value || "").trim().toLowerCase(); }

  function renderContacts() {
    $("crmAddRow").innerHTML = '<button class="new-btn" id="addContactBtn">+ Контакт</button>';
    $("addContactBtn").onclick = function () { openContactEditor(null); };
    var q = crmQuery();
    var list = crm.contacts.slice()
      .filter(function (c) { return !q || String(c.name || "").toLowerCase().includes(q) || String(c.telegram || "").toLowerCase().includes(q); })
      .sort(function (a, b) { return String(a.name || "").localeCompare(String(b.name || "")); });
    $("crmList").innerHTML = list.length ? list.map(function (c) {
      var typeLabel = { author: "Автор", partner: "Партнёр", speaker: "Спикер", other: "" }[c.type] || "";
      var ivCount = crm.interviews.filter(function (iv) { return String(iv.contactId) === String(c.id); }).length;
      var meta = [typeLabel, c.telegram, c.phone].filter(Boolean).join(" · ") + (ivCount ? ` · ${ivCount} интервью` : "");
      return '<div class="crm-row" data-id="' + c.id + '">' +
        '<div><div class="ttl">' + esc(c.name || "Без имени") + '</div>' +
        '<div class="meta">' + esc(meta) + '</div></div></div>';
    }).join("") : '<div class="empty">Ничего не найдено</div>';
    $("crmList").querySelectorAll(".crm-row").forEach(function (row) {
      row.onclick = function () { openContactEditor(Number(row.dataset.id)); };
    });
  }

  function openContactEditor(id) {
    var c = id ? crm.contacts.find(function (x) { return x.id === id; }) : null;
    crmCurrent = { kind: "contact", entity: c ? Object.assign({}, c) : { id: nextCrmId("contacts"), name: "", type: "author", telegram: "", email: "", phone: "", note: "" } };
    fillCrmEditor();
  }

  // ── Интервью ─────────────────────────────────────────────────────────────
  var STATUS_CYCLE = ["planned", "done", "transcribing", "ready"];

  function renderInterviews() {
    $("crmAddRow").innerHTML = '<button class="new-btn" id="addInterviewBtn">+ Интервью</button>';
    $("addInterviewBtn").onclick = function () { openInterviewEditor(null); };
    var q = crmQuery();
    var list = crm.interviews.slice()
      .filter(function (iv) { return !q || String(iv.subject || "").toLowerCase().includes(q) || contactName(iv.contactId).toLowerCase().includes(q); })
      .sort(function (a, b) { return String(a.scheduledAt || "").localeCompare(String(b.scheduledAt || "")); });
    $("crmList").innerHTML = list.length ? list.map(function (iv) {
      var when = iv.scheduledAt ? new Date(iv.scheduledAt).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "без даты";
      var meet = iv.meetLink ? ' <span data-act="joinmeet" data-id="' + iv.id + '" title="Открыть встречу">🎥</span>' : "";
      return '<div class="crm-row" data-id="' + iv.id + '">' +
        '<div><div class="ttl">' + esc(iv.subject || "Без темы") + '</div>' +
        '<div class="meta">' + esc(contactName(iv.contactId)) + ' · ' + esc(when) + meet + '</div></div>' +
        '<span class="status-badge st-' + esc(iv.status || "planned") + '" data-act="cyclestatus" data-id="' + iv.id + '">' +
        esc(STATUS_LABEL[iv.status] || "Запланировано") + '</span></div>';
    }).join("") : '<div class="empty">Ничего не найдено</div>';
    $("crmList").querySelectorAll('[data-act="joinmeet"]').forEach(function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        var iv = crm.interviews.find(function (x) { return x.id === Number(el.dataset.id); });
        if (!iv || !iv.meetLink) return;
        if (tgw && tgw.openLink) tgw.openLink(iv.meetLink); else window.open(iv.meetLink, "_blank");
      };
    });
    $("crmList").querySelectorAll(".crm-row").forEach(function (row) {
      row.onclick = function (ev) {
        if (ev.target.closest('[data-act="cyclestatus"], [data-act="joinmeet"]')) return;
        openInterviewEditor(Number(row.dataset.id));
      };
    });
    // Статус по кругу тапом на бейдж — самое частое действие с интервью
    // (провёл → расшифровываю → готово) не должно требовать открытия формы
    // ради одной смены значения в select'е.
    $("crmList").querySelectorAll('[data-act="cyclestatus"]').forEach(function (badge) {
      badge.onclick = function (ev) {
        ev.stopPropagation();
        var iv = crm.interviews.find(function (x) { return x.id === Number(badge.dataset.id); });
        if (!iv) return;
        var next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(iv.status) + 1) % STATUS_CYCLE.length];
        iv.status = next;
        iv.updatedAt = new Date().toISOString();
        badge.textContent = "…";
        saveCrm().then(function () { haptic("success"); renderInterviews(); }).catch(function (e) { toast("Ошибка: " + e.message, true); renderInterviews(); });
      };
    });
  }

  function openInterviewEditor(id) {
    var iv = id ? crm.interviews.find(function (x) { return x.id === id; }) : null;
    crmCurrent = { kind: "interview", entity: iv ? Object.assign({}, iv) : { id: nextCrmId("interviews"), subject: "", contactId: null, status: "planned", scheduledAt: "", meetLink: "", notes: "", reminded: false } };
    fillCrmEditor();
  }

  function nextCrmId(section) {
    var max = 0;
    (crm[section] || []).forEach(function (x) { max = Math.max(max, Number(x.id) || 0); });
    return max + 1;
  }

  // ── Общий редактор контакта/интервью ────────────────────────────────────
  function fillCrmEditor() {
    var isContact = crmCurrent.kind === "contact";
    var e = crmCurrent.entity;
    ["name", "type", "telegram", "email", "phone"].forEach(function (f) {
      $("ce-" + f + "-wrap").style.display = isContact ? "" : "none";
    });
    ["subject", "contact", "status", "when", "meet"].forEach(function (f) {
      $("ce-" + f + "-wrap").style.display = isContact ? "none" : "";
    });
    $("ceNameLabel").textContent = "Имя";

    if (isContact) {
      $("ce-name").value = e.name || "";
      $("ce-type").value = e.type || "author";
      $("ce-telegram").value = e.telegram || "";
      $("ce-email").value = e.email || "";
      $("ce-phone").value = e.phone || "";
    } else {
      $("ce-subject").value = e.subject || "";
      $("ce-contact").innerHTML = '<option value="">— без контакта —</option>' +
        crm.contacts.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join("");
      $("ce-contact").value = e.contactId || "";
      $("ce-status").value = e.status || "planned";
      $("ce-when").value = e.scheduledAt ? e.scheduledAt.slice(0, 16) : "";
      $("ce-meet").value = e.meetLink || "";
    }
    $("ce-note").value = (isContact ? e.note : e.notes) || "";
    $("ceDeleteBtn").style.display = (id_of(e) ? "" : "none");

    $("home-view").classList.add("hidden");
    $("crm-view").classList.add("hidden");
    $("crm-editor").classList.remove("hidden");
    $("crm-editor").scrollTop = 0;
    tgw && tgw.BackButton && tgw.BackButton.show();
    setDirty(false);
  }
  function id_of(e) {
    // Новая запись получает id заранее (nextCrmId), поэтому отличаем
    // «уже существует» по факту присутствия в crm.*, не по наличию id.
    if (crmCurrent.kind === "contact") return crm.contacts.some(function (x) { return x.id === e.id; });
    return crm.interviews.some(function (x) { return x.id === e.id; });
  }

  $("crm-editor").addEventListener("input", function () { setDirty(true); });
  $("crm-editor").addEventListener("change", function () { setDirty(true); });
  $("crm-editor").addEventListener("click", function (ev) {
    if (ev.target.closest("#ceCancelBtn, #ceSaveBtn, #ceDeleteBtn")) return;
    setDirty(true);
  });

  function closeCrmEditor() {
    $("crm-editor").classList.add("hidden");
    crmCurrent = null;
    setDirty(false);
    $("crm-view").classList.remove("hidden");
    renderCrmList();
  }
  $("ceCancelBtn").onclick = goBack;

  $("ceSaveBtn").onclick = async function () {
    if (!crmCurrent) return;
    var isContact = crmCurrent.kind === "contact";
    var e = crmCurrent.entity;
    if (isContact) {
      e.name = $("ce-name").value.trim();
      if (!e.name) { toast("Имя не может быть пустым", true); return; }
      e.type = $("ce-type").value;
      e.telegram = $("ce-telegram").value.trim();
      e.email = $("ce-email").value.trim();
      e.phone = $("ce-phone").value.trim();
    } else {
      e.subject = $("ce-subject").value.trim();
      if (!e.subject) { toast("Тема не может быть пустой", true); return; }
      e.contactId = $("ce-contact").value ? Number($("ce-contact").value) : null;
      e.status = $("ce-status").value;
      e.scheduledAt = $("ce-when").value || "";
      e.reminded = false;   // время могли перенести — напоминание должно сработать заново
      e.overdueNotified = false;
      e.meetLink = $("ce-meet").value.trim();
    }
    var noteVal = $("ce-note").value.trim();
    if (isContact) e.note = noteVal; else e.notes = noteVal;
    e.updatedAt = new Date().toISOString();

    var btn = $("ceSaveBtn");
    btn.disabled = true;
    btn.textContent = "Сохраняю…";
    try {
      var list = isContact ? crm.contacts : crm.interviews;
      var idx = list.findIndex(function (x) { return x.id === e.id; });
      if (idx >= 0) list[idx] = e; else list.push(e);
      await saveCrm();
      setDirty(false);
      toast("Сохранено");
      haptic("success");
      closeCrmEditor();
    } catch (err) {
      toast("Ошибка: " + err.message, true);
      haptic("error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Сохранить";
    }
  };

  $("ceDeleteBtn").onclick = function () {
    if (!crmCurrent) return;
    var isContact = crmCurrent.kind === "contact";
    var doDelete = async function () {
      var list = isContact ? crm.contacts : crm.interviews;
      var idx = list.findIndex(function (x) { return x.id === crmCurrent.entity.id; });
      if (idx >= 0) list.splice(idx, 1);
      try {
        await saveCrm();
        setDirty(false);
        toast("Удалено");
        closeCrmEditor();
      } catch (err) { toast("Ошибка: " + err.message, true); }
    };
    if (tgw && tgw.showConfirm) tgw.showConfirm("Удалить запись без возможности отмены?", function (ok) { if (ok) doDelete(); });
    else if (window.confirm("Удалить запись без возможности отмены?")) doDelete();
  };

  // ── Заметки: стикеры, ничем не привязаны ────────────────────────────────
  // Автосохранение с debounce — не «Сохранить» на каждую заметку отдельно,
  // это были бы лишние тапы ради строчки текста.
  function renderNotes() {
    $("crmAddRow").innerHTML = '<button class="new-btn" id="addNoteBtn">+ Заметка</button>';
    $("addNoteBtn").onclick = function () {
      var note = { id: nextCrmId("notes"), text: "", createdAt: new Date().toISOString() };
      crm.notes.unshift(note);
      saveCrm().catch(function () {});
      renderNotes();
    };
    var q = crmQuery();
    var list = crm.notes.slice()
      .filter(function (n) { return !q || String(n.text || "").toLowerCase().includes(q); })
      .sort(function (a, b) { return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
    $("crmList").innerHTML = list.length ? list.map(function (n) {
      var when = n.createdAt ? String(n.createdAt).slice(0, 10) : "";
      return '<div class="note-card" data-id="' + n.id + '">' +
        '<textarea placeholder="Заметка…">' + esc(n.text) + '</textarea>' +
        '<div class="note-foot"><span class="note-date">' + esc(when) + '</span><span class="note-del" data-act="delnote">✕</span></div></div>';
    }).join("") : '<div class="empty">Ничего не найдено</div>';

    $("crmList").querySelectorAll(".note-card textarea").forEach(function (ta) {
      autoGrow(ta);
      var id = Number(ta.closest(".note-card").dataset.id);
      var timer = null;
      ta.addEventListener("input", function () {
        autoGrow(ta);
        clearTimeout(timer);
        timer = setTimeout(function () {
          var note = crm.notes.find(function (x) { return x.id === id; });
          if (!note) return;
          note.text = ta.value;
          note.updatedAt = new Date().toISOString();
          saveCrm().then(function () { toast("Заметка сохранена"); }).catch(function (e) { toast("Не сохранилось: " + e.message, true); });
        }, 900);
      });
    });
    $("crmList").querySelectorAll('[data-act="delnote"]').forEach(function (btn) {
      btn.onclick = function () {
        var id = Number(btn.closest(".note-card").dataset.id);
        crm.notes = crm.notes.filter(function (x) { return x.id !== id; });
        saveCrm().then(renderNotes).catch(function (e) { toast("Не удалилось: " + e.message, true); });
      };
    });
  }

  // ── Внешняя ссылка на материал: та же схема slug'ов, что и на сайте ────────
  function slugify(v) {
    return String(v || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 60);
  }
  function siteUrl(section, entity) {
    if (section === "reviews") return "https://eprisjournal.com/review/" + entity.id;
    var slug = slugify(entity.title);
    return slug ? "https://eprisjournal.com/article/" + slug : "https://eprisjournal.com/articles";
  }
  $("openSiteLink").onclick = function () {
    if (!current) return;
    var url = siteUrl(current.section, current.entity);
    if (tgw && tgw.openLink) tgw.openLink(url); else window.open(url, "_blank");
  };

  $("refreshBtn").onclick = async function () {
    var btn = $("refreshBtn");
    btn.classList.add("spin");
    try {
      await loadContent();
      if (!$("home-view").classList.contains("hidden")) renderHome();
      if (!$("list-view").classList.contains("hidden")) renderList();
      toast("Обновлено");
    } catch (e) {
      toast("Не удалось обновить: " + e.message, true);
    } finally {
      setTimeout(function () { btn.classList.remove("spin"); }, 600);
    }
  };

  // ── Клавиатура закрывает поле ввода ─────────────────────────────────────
  // Мобильный Telegram WebView не всегда ужимает вьюпорт под открывшуюся
  // клавиатуру (даже с interactive-widget=resizes-content — зависит от
  // клиента), так что активное поле молча уезжает под неё. Чиним сами:
  // держим #editor с запасом снизу, равным высоте клавиатуры, и подкручиваем
  // фокус в видимую область.
  var kbPad = document.createElement("div");
  kbPad.id = "kbPad";
  document.body.appendChild(kbPad);
  kbPad.style.cssText = "height:0;transition:height .15s;";

  function syncKeyboardPad() {
    if (!window.visualViewport) return;
    var gap = Math.max(0, window.innerHeight - window.visualViewport.height);
    kbPad.style.height = gap + "px";
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncKeyboardPad);
  }

  document.addEventListener("focusin", function (ev) {
    var t = ev.target;
    if (!t.matches || !t.matches("input, textarea, select")) return;
    setTimeout(function () {
      syncKeyboardPad();
      t.scrollIntoView({ block: "center", behavior: "smooth" });
    }, 300);
  });
  document.addEventListener("focusout", function (ev) {
    var t = ev.target;
    if (!t.matches || !t.matches("input, textarea, select")) return;
    setTimeout(function () {
      if (!document.activeElement || !document.activeElement.matches("input, textarea, select")) {
        kbPad.style.height = "0";
      }
    }, 200);
  });

  // ── Возврат из фона / полузакрытого состояния ───────────────────────────
  // Telegram сворачивает Mini App в фон (переключились в другой чат, экран
  // заблокировали) и на iOS умеет открывать её половинчатым нижним листом
  // до полного разворота. И то, и другое иногда сбрасывает tgw.expand() и
  // оставляет заголовок недоступным под шторкой — переразворачиваем при
  // каждом возврате. Контент тоже тихо освежаем, если давно не трогали и
  // сейчас не заняты редактированием (чтобы не сбить незаконченную правку).
  var STALE_MS = 3 * 60 * 1000;
  function onResume() {
    if (!tgw) return;
    try { tgw.expand(); } catch (e) {}
    if ($("editor").classList.contains("open")) return;   // не мешаем правке
    if (!ADMIN_PW) return;                                  // boot ещё не прошёл
    if (Date.now() - bootedAt < STALE_MS) return;
    loadContent().then(function () {
      bootedAt = Date.now();
      if (!$("home-view").classList.contains("hidden")) renderHome();
      if (!$("list-view").classList.contains("hidden")) renderList();
    }).catch(function () { /* тихо: следующий явный ↻ или открытие покажет ошибку */ });
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") onResume();
  });
  if (tgw && tgw.onEvent) {
    try { tgw.onEvent("activated", onResume); } catch (e) {}
  }

  boot();
})();
</script>
</body>
</html>
