  function renderCrmList() {
    if (crmActiveTab === "notes") { renderNotes(); return; }
    if (crmActiveTab === "contacts") { renderContacts(); return; }
    renderInterviews();
  }

  // ── Контакты ─────────────────────────────────────────────────────────────
  function crmQuery() { return ($("crmSearch").value || "").trim().toLowerCase(); }

  function renderContacts() {
    $("crmAddRow").innerHTML = '<button class="new-btn" id="addContactBtn">+ Контакт</button>';
    $("addContactBtn").onclick = function () { openContactEditor(null); };
    var q = crmQuery();
    var list = crm.contacts.slice()
      .filter(function (c) { return !q || String(c.name || "").toLowerCase().includes(q) || String(c.telegram || "").toLowerCase().includes(q); })
      .sort(function (a, b) { return String(a.name || "").localeCompare(String(b.name || "")); });
    $("crmList").innerHTML = list.length ? list.map(function (c) {
      var typeLabel = { author: "Автор", partner: "Партнёр", speaker: "Спикер", other: "" }[c.type] || "";
      var ivCount = crm.interviews.filter(function (iv) { return String(iv.contactId) === String(c.id); }).length;
      var meta = [typeLabel, c.telegram, c.phone].filter(Boolean).join(" · ") + (ivCount ? ` · ${ivCount} интервью` : "");
      return '<div class="crm-row" data-id="' + c.id + '">' +
        '<div><div class="ttl">' + esc(c.name || "Без имени") + '</div>' +
        '<div class="meta">' + esc(meta) + '</div></div></div>';
    }).join("") : '<div class="empty">Ничего не найдено</div>';
    $("crmList").querySelectorAll(".crm-row").forEach(function (row) {
      row.onclick = function () { openContactEditor(Number(row.dataset.id)); };
    });
  }

  function openContactEditor(id) {
    var c = id ? crm.contacts.find(function (x) { return x.id === id; }) : null;
    crmCurrent = { kind: "contact", entity: c ? Object.assign({}, c) : { id: nextCrmId("contacts"), name: "", type: "author", telegram: "", email: "", phone: "", note: "" } };
    fillCrmEditor();
  }

  // ── Интервью ─────────────────────────────────────────────────────────────
  var STATUS_CYCLE = ["planned", "done", "transcribing", "ready"];

  function renderInterviews() {
    $("crmAddRow").innerHTML = '<button class="new-btn" id="addInterviewBtn">+ Интервью</button>';
    $("addInterviewBtn").onclick = function () { openInterviewEditor(null); };
    var q = crmQuery();
    var list = crm.interviews.slice()
      .filter(function (iv) { return !q || String(iv.subject || "").toLowerCase().includes(q) || contactName(iv.contactId).toLowerCase().includes(q); })
      .sort(function (a, b) { return String(a.scheduledAt || "").localeCompare(String(b.scheduledAt || "")); });
    $("crmList").innerHTML = list.length ? list.map(function (iv) {
      var when = iv.scheduledAt ? new Date(iv.scheduledAt).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "без даты";
      var meet = iv.meetLink ? ' <span data-act="joinmeet" data-id="' + iv.id + '" title="Открыть встречу">🎥</span>' : "";
      return '<div class="crm-row" data-id="' + iv.id + '">' +
        '<div><div class="ttl">' + esc(iv.subject || "Без темы") + '</div>' +
        '<div class="meta">' + esc(contactName(iv.contactId)) + ' · ' + esc(when) + meet + '</div></div>' +
        '<span class="status-badge st-' + esc(iv.status || "planned") + '" data-act="cyclestatus" data-id="' + iv.id + '">' +
        esc(STATUS_LABEL[iv.status] || "Запланировано") + '</span></div>';
    }).join("") : '<div class="empty">Ничего не найдено</div>';
    $("crmList").querySelectorAll('[data-act="joinmeet"]').forEach(function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        var iv = crm.interviews.find(function (x) { return x.id === Number(el.dataset.id); });
        if (!iv || !iv.meetLink) return;
        if (tgw && tgw.openLink) tgw.openLink(iv.meetLink); else window.open(iv.meetLink, "_blank");
      };
    });
    $("crmList").querySelectorAll(".crm-row").forEach(function (row) {
      row.onclick = function (ev) {
        if (ev.target.closest('[data-act="cyclestatus"], [data-act="joinmeet"]')) return;
        openInterviewEditor(Number(row.dataset.id));
      };
    });
    // Статус по кругу тапом на бейдж — самое частое действие с интервью
    // (провёл → расшифровываю → готово) не должно требовать открытия формы
    // ради одной смены значения в select'е.
    $("crmList").querySelectorAll('[data-act="cyclestatus"]').forEach(function (badge) {
      badge.onclick = function (ev) {
        ev.stopPropagation();
        var iv = crm.interviews.find(function (x) { return x.id === Number(badge.dataset.id); });
        if (!iv) return;
        var next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(iv.status) + 1) % STATUS_CYCLE.length];
        iv.status = next;
        iv.updatedAt = new Date().toISOString();
        badge.textContent = "…";
        saveCrm().then(function () { haptic("success"); renderInterviews(); }).catch(function (e) { toast("Ошибка: " + e.message, true); renderInterviews(); });
      };
    });
  }

  function openInterviewEditor(id) {
    var iv = id ? crm.interviews.find(function (x) { return x.id === id; }) : null;
    crmCurrent = { kind: "interview", entity: iv ? Object.assign({}, iv) : { id: nextCrmId("interviews"), subject: "", contactId: null, status: "planned", scheduledAt: "", meetLink: "", notes: "", reminded: false } };
    fillCrmEditor();
  }

  function nextCrmId(section) {
    var max = 0;
    (crm[section] || []).forEach(function (x) { max = Math.max(max, Number(x.id) || 0); });
    return max + 1;
  }

  // ── Общий редактор контакта/интервью ────────────────────────────────────
  function fillCrmEditor() {
    var isContact = crmCurrent.kind === "contact";
    var e = crmCurrent.entity;
    ["name", "type", "telegram", "email", "phone"].forEach(function (f) {
      $("ce-" + f + "-wrap").style.display = isContact ? "" : "none";
    });
    ["subject", "contact", "status", "when", "meet"].forEach(function (f) {
      $("ce-" + f + "-wrap").style.display = isContact ? "none" : "";
    });
    $("ceNameLabel").textContent = "Имя";

    if (isContact) {
      $("ce-name").value = e.name || "";
      $("ce-type").value = e.type || "author";
      $("ce-telegram").value = e.telegram || "";
      $("ce-email").value = e.email || "";
      $("ce-phone").value = e.phone || "";
    } else {
      $("ce-subject").value = e.subject || "";
      $("ce-contact").innerHTML = '<option value="">— без контакта —</option>' +
        crm.contacts.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join("");
      $("ce-contact").value = e.contactId || "";
      $("ce-status").value = e.status || "planned";
      $("ce-when").value = e.scheduledAt ? e.scheduledAt.slice(0, 16) : "";
      $("ce-meet").value = e.meetLink || "";
    }
    $("ce-note").value = (isContact ? e.note : e.notes) || "";
    $("ceDeleteBtn").style.display = (id_of(e) ? "" : "none");

    $("home-view").classList.add("hidden");
    $("crm-view").classList.add("hidden");
    $("crm-editor").classList.remove("hidden");
    $("crm-editor").scrollTop = 0;
    tgw && tgw.BackButton && tgw.BackButton.show();
    setDirty(false);
  }
  function id_of(e) {
    // Новая запись получает id заранее (nextCrmId), поэтому отличаем
    // «уже существует» по факту присутствия в crm.*, не по наличию id.
    if (crmCurrent.kind === "contact") return crm.contacts.some(function (x) { return x.id === e.id; });
    return crm.interviews.some(function (x) { return x.id === e.id; });
  }

  $("crm-editor").addEventListener("input", function () { setDirty(true); });
  $("crm-editor").addEventListener("change", function () { setDirty(true); });
  $("crm-editor").addEventListener("click", function (ev) {
    if (ev.target.closest("#ceCancelBtn, #ceSaveBtn, #ceDeleteBtn")) return;
    setDirty(true);
  });

  function closeCrmEditor() {
    $("crm-editor").classList.add("hidden");
    crmCurrent = null;
    setDirty(false);
    $("crm-view").classList.remove("hidden");
    renderCrmList();
  }
  $("ceCancelBtn").onclick = goBack;

  $("ceSaveBtn").onclick = async function () {
    if (!crmCurrent) return;
    var isContact = crmCurrent.kind === "contact";
    var e = crmCurrent.entity;
    if (isContact) {
      e.name = $("ce-name").value.trim();
      if (!e.name) { toast("Имя не может быть пустым", true); return; }
      e.type = $("ce-type").value;
      e.telegram = $("ce-telegram").value.trim();
      e.email = $("ce-email").value.trim();
      e.phone = $("ce-phone").value.trim();
    } else {
      e.subject = $("ce-subject").value.trim();
      if (!e.subject) { toast("Тема не может быть пустой", true); return; }
      e.contactId = $("ce-contact").value ? Number($("ce-contact").value) : null;
      e.status = $("ce-status").value;
      e.scheduledAt = $("ce-when").value || "";
      e.reminded = false;   // время могли перенести — напоминание должно сработать заново
      e.overdueNotified = false;
      e.meetLink = $("ce-meet").value.trim();
    }
    var noteVal = $("ce-note").value.trim();
    if (isContact) e.note = noteVal; else e.notes = noteVal;
    e.updatedAt = new Date().toISOString();

    var btn = $("ceSaveBtn");
    btn.disabled = true;
    btn.textContent = "Сохраняю…";
    try {
      var list = isContact ? crm.contacts : crm.interviews;
      var idx = list.findIndex(function (x) { return x.id === e.id; });
      if (idx >= 0) list[idx] = e; else list.push(e);
      await saveCrm();
      setDirty(false);
      toast("Сохранено");
      haptic("success");
      closeCrmEditor();
    } catch (err) {
      toast("Ошибка: " + err.message, true);
      haptic("error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Сохранить";
    }
  };

  $("ceDeleteBtn").onclick = function () {
    if (!crmCurrent) return;
    var isContact = crmCurrent.kind === "contact";
    var doDelete = async function () {
      var list = isContact ? crm.contacts : crm.interviews;
      var idx = list.findIndex(function (x) { return x.id === crmCurrent.entity.id; });
      if (idx >= 0) list.splice(idx, 1);
      try {
        await saveCrm();
        setDirty(false);
        toast("Удалено");
        closeCrmEditor();
      } catch (err) { toast("Ошибка: " + err.message, true); }
    };
    if (tgw && tgw.showConfirm) tgw.showConfirm("Удалить запись без возможности отмены?", function (ok) { if (ok) doDelete(); });
    else if (window.confirm("Удалить запись без возможности отмены?")) doDelete();
  };

  // ── Заметки: стикеры, ничем не привязаны ────────────────────────────────
  // Автосохранение с debounce — не «Сохранить» на каждую заметку отдельно,
  // это были бы лишние тапы ради строчки текста.
  function renderNotes() {
    $("crmAddRow").innerHTML = '<button class="new-btn" id="addNoteBtn">+ Заметка</button>';
    $("addNoteBtn").onclick = function () {
      var note = { id: nextCrmId("notes"), text: "", createdAt: new Date().toISOString() };
      crm.notes.unshift(note);
      saveCrm().catch(function () {});
      renderNotes();
    };
    var q = crmQuery();
    var list = crm.notes.slice()
      .filter(function (n) { return !q || String(n.text || "").toLowerCase().includes(q); })
      .sort(function (a, b) { return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
    $("crmList").innerHTML = list.length ? list.map(function (n) {
      var when = n.createdAt ? String(n.createdAt).slice(0, 10) : "";
      return '<div class="note-card" data-id="' + n.id + '">' +
        '<textarea placeholder="Заметка…">' + esc(n.text) + '</textarea>' +
        '<div class="note-foot"><span class="note-date">' + esc(when) + '</span>' +
        '<span class="note-actions"><span class="note-done" data-act="donenote">✓ Готово</span>' +
        '<span class="note-del" data-act="delnote">✕</span></span></div></div>';
    }).join("") : '<div class="empty">Ничего не найдено</div>';

    $("crmList").querySelectorAll(".note-card textarea").forEach(function (ta) {
      autoGrow(ta);
      var id = Number(ta.closest(".note-card").dataset.id);
      var timer = null;
      function flush() {
        clearTimeout(timer);
        var note = crm.notes.find(function (x) { return x.id === id; });
        if (!note || note.text === ta.value) return;
        note.text = ta.value;
        note.updatedAt = new Date().toISOString();
        saveCrm().then(function () { toast("Заметка сохранена"); }).catch(function (e) { toast("Не сохранилось: " + e.message, true); });
      }
      ta.addEventListener("input", function () {
        autoGrow(ta);
        clearTimeout(timer);
        timer = setTimeout(flush, 900);
      });
      // Уход с поля (тап вовне, скрытие клавиатуры) сохраняет сразу, не
      // дожидаясь дебаунса — раньше можно было закрыть CRM в те самые 900мс
      // и потерять последний символ.
      ta.addEventListener("blur", flush);
      var doneBtn = ta.closest(".note-card").querySelector('[data-act="donenote"]');
      if (doneBtn) doneBtn.addEventListener("click", function () { ta.blur(); });
    });
    $("crmList").querySelectorAll('[data-act="delnote"]').forEach(function (btn) {
      btn.onclick = function () {
        var id = Number(btn.closest(".note-card").dataset.id);
        crm.notes = crm.notes.filter(function (x) { return x.id !== id; });
        saveCrm().then(renderNotes).catch(function (e) { toast("Не удалилось: " + e.message, true); });
      };
    });
  }

  // ── Внешняя ссылка на материал: та же схема slug'ов, что и на сайте ────────
  function slugify(v) {
    return String(v || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 60);
  }
  function siteUrl(section, entity) {
    if (section === "reviews") return "https://eprisjournal.com/review/" + entity.id;
    var slug = slugify(entity.title);
    return slug ? "https://eprisjournal.com/article/" + slug : "https://eprisjournal.com/articles";
  }
  $("openSiteLink").onclick = function () {
    if (!current) return;
    var url = siteUrl(current.section, current.entity);
    if (tgw && tgw.openLink) tgw.openLink(url); else window.open(url, "_blank");
  };

  $("refreshBtn").onclick = async function () {
    var btn = $("refreshBtn");
    btn.classList.add("spin");
    try {
      await loadContent();
      if (!$("home-view").classList.contains("hidden")) renderHome();
      if (!$("list-view").classList.contains("hidden")) renderList();
      toast("Обновлено");
    } catch (e) {
      toast("Не удалось обновить: " + e.message, true);
    } finally {
      setTimeout(function () { btn.classList.remove("spin"); }, 600);
    }
  };

  // ── Клавиатура закрывает поле ввода ─────────────────────────────────────
  // Мобильный Telegram WebView не всегда ужимает вьюпорт под открывшуюся
  // клавиатуру (даже с interactive-widget=resizes-content — зависит от
  // клиента), так что активное поле молча уезжает под неё. Чиним сами:
  // держим #editor с запасом снизу, равным высоте клавиатуры, и подкручиваем
  // фокус в видимую область.
  var kbPad = document.createElement("div");
  kbPad.id = "kbPad";
  document.body.appendChild(kbPad);
  kbPad.style.cssText = "height:0;transition:height .15s;";

  function syncKeyboardPad() {
    if (!window.visualViewport) return;
    var gap = Math.max(0, window.innerHeight - window.visualViewport.height);
    kbPad.style.height = gap + "px";
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncKeyboardPad);
  }

  document.addEventListener("focusin", function (ev) {
    var t = ev.target;
    if (!t.matches || !t.matches("input, textarea, select")) return;
    document.body.classList.add("kb-open");
    setTimeout(function () {
      syncKeyboardPad();
      // Полноэкранное поле подгонять не надо: оно и так ровно во весь
      // видимый экран, а scrollIntoView на нём дёргает страницу под ним.
      if (t.id !== "bf-text") t.scrollIntoView({ block: "center", behavior: "smooth" });
    }, 300);
  });
  document.addEventListener("focusout", function (ev) {
    var t = ev.target;
    if (!t.matches || !t.matches("input, textarea, select")) return;
    setTimeout(function () {
      if (!document.activeElement || !document.activeElement.matches("input, textarea, select")) {
        kbPad.style.height = "0";
        document.body.classList.remove("kb-open");
      }
    }, 200);
  });

  // ── Возврат из фона / полузакрытого состояния ───────────────────────────
  // Telegram сворачивает Mini App в фон (переключились в другой чат, экран
  // заблокировали) и на iOS умеет открывать её половинчатым нижним листом
  // до полного разворота. И то, и другое иногда сбрасывает tgw.expand() и
  // оставляет заголовок недоступным под шторкой — переразворачиваем при
  // каждом возврате. Контент тоже тихо освежаем, если давно не трогали и
  // сейчас не заняты редактированием (чтобы не сбить незаконченную правку).
  var STALE_MS = 3 * 60 * 1000;
  function onResume() {
    if (!tgw) return;
    try { tgw.expand(); } catch (e) {}
    if ($("editor").classList.contains("open")) return;   // не мешаем правке
    if (!ADMIN_PW) return;                                  // boot ещё не прошёл
    if (Date.now() - bootedAt < STALE_MS) return;
    loadContent().then(function () {
      bootedAt = Date.now();
      if (!$("home-view").classList.contains("hidden")) renderHome();
      if (!$("list-view").classList.contains("hidden")) renderList();
    }).catch(function () { /* тихо: следующий явный ↻ или открытие покажет ошибку */ });
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") onResume();
  });
  if (tgw && tgw.onEvent) {
    try { tgw.onEvent("activated", onResume); } catch (e) {}
  }


  /* ── АНКЕТЫ ────────────────────────────────────────────────────────────────
   *
   * Раздел повторяет работу, которая до этого была только в большой админке:
   * список анкет, персональные ссылки-приглашения, ответы целиком и файлы.
   * Служба анкет живёт отдельным процессом (см. /forms на api), поэтому она
   * отвечает даже когда идёт выкат сайта — читать ответы с телефона можно
   * всегда.
   *
   * Файлы отдаются только по паролю и только этой точкой, прямой ссылки на
   * диск нет. Значит, скачать их простым <a href> нельзя: тянем тело с
   * заголовком и отдаём браузеру blob. */
  var FORMS_API = API + "/forms";
  var formsList = [];
  var formsLoaded = false;
  var currentForm = null;      // { form, responses }
  var currentResponse = null;

  function formsHeaders(extra) {
    return Object.assign({ "X-Admin-Password": ADMIN_PW }, extra || {});
  }

  function showFormsView(which) {
    ["home-view", "list-view", "crm-view", "forms-view", "form-view", "resp-view"].forEach(function (id) {
      $(id).classList.toggle("hidden", id !== which);
    });
    tgw && tgw.BackButton && (which === "home-view" ? tgw.BackButton.hide() : tgw.BackButton.show());
    if (which === "forms-view") renderFormsList();
    if (which === "form-view") renderForm();
    if (which === "resp-view") renderResponse();
  }

  async function loadForms() {
    var res = await fetchJSON(FORMS_API + "/list", { headers: formsHeaders(), cache: "no-store" });
    if (!res.data || !res.data.ok) throw new Error("анкеты недоступны (HTTP " + res.status + ")");
    formsList = (res.data.forms || []).slice().sort(function (a, b) {
      return String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""));
    });
    formsLoaded = true;
  }

  async function openForms() {
    if (!formsLoaded) {
      try { await loadForms(); } catch (e) { toast("Не удалось загрузить анкеты: " + e.message, true); return; }
    }
    showFormsView("forms-view");
  }

  var FORM_STATUS = { open: "приём открыт", closed: "закрыта", draft: "черновик" };

  function formStatusBadge(f) {
    var cls = f.status === "open" ? "live" : "draft";
    return '<span class="badge ' + cls + '">' + esc(FORM_STATUS[f.status] || f.status) + '</span>';
  }

  function renderFormsList() {
    var q = ($("formsSearch").value || "").trim().toLowerCase();
    var rows = formsList.filter(function (f) {
      return !q || String(f.title || "").toLowerCase().includes(q);
    });
    $("formsRows").innerHTML = rows.length ? rows.map(function (f) {
      var count = Number(f.responses || 0);
      var meta = [
        count ? count + " " + plural(count, "ответ", "ответа", "ответов") : "ответов нет",
        f.access === "invite" ? "по приглашению" : "по ссылке",
        Number(f.invites || 0) ? f.invites + " пригл." : "",
      ].filter(Boolean).join(" · ");
      return '<div class="row" data-formid="' + esc(f.id) + '">' +
        '<div><div class="cat">' + esc(String(f.language || "").toUpperCase()) + '</div>' +
        '<div class="ttl">' + esc(f.title || "без названия") + '</div>' +
        '<div class="prev">' + esc(meta) + '</div></div>' +
        '<div class="side">' + formStatusBadge(f) +
        '<span class="when">' + esc(shortDate(f.updatedAt)) + '</span></div></div>';
    }).join("") : '<div class="empty">Ничего не найдено</div>';
    $("formsRows").querySelectorAll(".row").forEach(function (row) {
      row.onclick = function () { openForm(row.dataset.formid); };
    });
  }

  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  async function openForm(id) {
    var res = await fetchJSON(FORMS_API + "/" + encodeURIComponent(id) + "/responses", { headers: formsHeaders(), cache: "no-store" }, 20000);
    if (!res.data || !res.data.ok) { toast("Не удалось открыть анкету (HTTP " + res.status + ")", true); return; }
    currentForm = { form: res.data.form, responses: res.data.responses || [], invites: [] };
    showFormsView("form-view");
    loadInvites();
  }

  async function loadInvites() {
    if (!currentForm) return;
    var res = await fetchJSON(FORMS_API + "/" + encodeURIComponent(currentForm.form.id) + "/invites", { headers: formsHeaders(), cache: "no-store" });
    currentForm.invites = (res.data && res.data.invites) || [];
    if (!$("form-view").classList.contains("hidden")) renderInvites();
  }

  function publicUrl(form, token) {
    return "https://eprisjournal.com/f/" + form.slug + (token ? "/" + token : "");
  }

  function copy(text, what) {
    var done = function () { toast((what || "Ссылка") + " скопирована"); haptic("success"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { toast(text); });
      return;
    }
    toast(text);
  }

  function renderForm() {
    if (!currentForm) return;
    var f = currentForm.form;
    var responses = currentForm.responses;
    var questions = (f.fields || []).filter(function (x) { return x.type !== "section"; }).length;
    $("formHead").innerHTML =
      '<div class="cat">' + esc(String(f.language || "").toUpperCase()) + ' · ' + esc(FORM_STATUS[f.status] || f.status) + '</div>' +
      '<div class="title" style="font-size:23px;margin:4px 0 8px;">' + esc(f.title || "без названия") + '</div>' +
      (f.description ? '<div class="prev" style="margin-bottom:10px;">' + esc(f.description) + '</div>' : '') +
      '<div class="prev" style="margin-bottom:12px;">' + questions + ' ' + plural(questions, "вопрос", "вопроса", "вопросов") +
        ' · ' + responses.length + ' ' + plural(responses.length, "ответ", "ответа", "ответов") +
        (f.closesAt ? ' · до ' + esc(shortDate(f.closesAt)) : '') +
        (f.maxResponses ? ' · лимит ' + f.maxResponses : '') + '</div>' +
      '<div class="new-row">' +
        '<button class="new-btn" data-act="copylink">Ссылка на анкету</button>' +
        '<button class="new-btn" data-act="openlink">Открыть</button>' +
        (responses.length ? '<button class="new-btn" data-act="zip">Файлы zip</button>' : '') +
      '</div>';
    $("formHead").querySelectorAll("[data-act]").forEach(function (btn) {
      var act = btn.dataset.act;
      btn.onclick = function () {
        if (act === "copylink") return copy(publicUrl(f), "Ссылка на анкету");
        if (act === "openlink") return tgw && tgw.openLink ? tgw.openLink(publicUrl(f)) : window.open(publicUrl(f), "_blank");
        if (act === "zip") return downloadProtected(FORMS_API + "/" + encodeURIComponent(f.id) + "/files.zip", (f.slug || "files") + ".zip", btn);
      };
    });
    renderInvites();
    renderResponsesList();
  }

  function renderInvites() {
    if (!currentForm) return;
    var f = currentForm.form;
    var invites = currentForm.invites || [];
    var rows = invites.map(function (iv) {
      var meta = [
        iv.revoked ? "отозвано" : (iv.usedAt ? "открыто " + shortDate(iv.usedAt) : "не открыто"),
        Number(iv.uses || 0) ? iv.uses + " заход." : "",
      ].filter(Boolean).join(" · ");
      return '<div class="row" data-token="' + esc(iv.token) + '">' +
        '<div><div class="ttl" style="font-size:16px;">' + esc(iv.label || iv.token) + '</div>' +
        '<div class="prev">' + esc(meta) + '</div></div>' +
        '<div class="side">' +
          '<span class="badge" data-act="copyinvite">ссылка</span>' +
          (ROLE === "admin" && !iv.revoked ? '<span class="badge draft" data-act="revoke">отозвать</span>' : '') +
        '</div></div>';
    }).join("");
    $("formInvites").innerHTML =
      '<div class="cat" style="margin:18px 0 8px;">Персональные приглашения</div>' +
      (rows || '<div class="empty" style="padding:14px 0;">Приглашений нет</div>') +
      (ROLE === "admin" ? '<div class="new-row"><button class="new-btn" id="addInviteBtn">+ Приглашение</button></div>' : '');
    $("formInvites").querySelectorAll(".row").forEach(function (row) {
      var token = row.dataset.token;
      var copyEl = row.querySelector('[data-act="copyinvite"]');
      if (copyEl) copyEl.onclick = function (ev) { ev.stopPropagation(); copy(publicUrl(f, token), "Персональная ссылка"); };
      var revokeEl = row.querySelector('[data-act="revoke"]');
      if (revokeEl) revokeEl.onclick = function (ev) { ev.stopPropagation(); revokeInvite(token); };
    });
    var addBtn = $("addInviteBtn");
    if (addBtn) addBtn.onclick = addInvite;
  }

  async function addInvite() {
    var label = window.prompt("Имя человека для персональной ссылки");
    if (label === null) return;
    label = String(label).trim();
    if (!label) return;
    var res = await fetchJSON(FORMS_API + "/" + encodeURIComponent(currentForm.form.id) + "/invites", {
      method: "POST",
      headers: formsHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ label: label }),
    });
    if (!res.data || !res.data.ok) { toast("Не создалось: " + ((res.data && res.data.error) || res.status), true); return; }
    await loadInvites();
    var made = (currentForm.invites || []).filter(function (iv) { return iv.label === label; }).pop();
    if (made) copy(publicUrl(currentForm.form, made.token), "Персональная ссылка");
  }

  async function revokeInvite(token) {
    if (!window.confirm("Отозвать это приглашение?")) return;
    var res = await fetchJSON(FORMS_API + "/" + encodeURIComponent(currentForm.form.id) + "/invites/" + encodeURIComponent(token), {
      method: "DELETE", headers: formsHeaders(),
    });
    if (!res.data || !res.data.ok) { toast("Не вышло: " + ((res.data && res.data.error) || res.status), true); return; }
    toast("Приглашение отозвано");
    await loadInvites();
  }

  function answerPreviewText(form, response) {
    var fields = (form.fields || []).filter(function (x) { return x.type !== "section"; });
    for (var i = 0; i < fields.length; i++) {
      var v = (response.answers || {})[fields[i].id];
      if (typeof v === "string" && v.trim()) return v.trim().slice(0, 120);
    }
    return "без текстовых ответов";
  }

  function renderResponsesList() {
    var f = currentForm.form;
    var responses = currentForm.responses.slice().sort(function (a, b) {
      return String(b.submittedAt || "").localeCompare(String(a.submittedAt || ""));
    });
    var rows = responses.map(function (r) {
      return '<div class="row" data-respid="' + esc(r.id) + '">' +
        '<div><div class="cat">' + esc(r.inviteLabel || "по ссылке") + '</div>' +
        '<div class="ttl" style="font-size:16px;">' + esc(shortDate(r.submittedAt)) + '</div>' +
        '<div class="prev">' + esc(answerPreviewText(f, r)) + '</div></div></div>';
    }).join("");
    $("formResponses").innerHTML =
      '<div class="cat" style="margin:22px 0 8px;">Ответы</div>' +
      (rows || '<div class="empty" style="padding:14px 0;">Ответов пока нет</div>');
    $("formResponses").querySelectorAll(".row").forEach(function (row) {
      row.onclick = function () {
        currentResponse = currentForm.responses.find(function (r) { return String(r.id) === row.dataset.respid; }) || null;
        if (currentResponse) showFormsView("resp-view");
      };
    });
  }

  function isFileList(v) {
    return Array.isArray(v) && v.length && v[0] && typeof v[0] === "object" && (v[0].id || v[0].name);
  }

  function humanBytes(n) {
    n = Number(n || 0);
    if (n < 1024) return n + " Б";
    if (n < 1024 * 1024) return Math.round(n / 1024) + " КБ";
    return (n / 1024 / 1024).toFixed(1) + " МБ";
  }

  function renderResponse() {
    if (!currentForm || !currentResponse) return;
    var f = currentForm.form;
    var r = currentResponse;
    var parts = [
      '<div class="cat">' + esc(r.inviteLabel || "по ссылке") + '</div>',
      '<div class="title" style="font-size:21px;margin:4px 0 4px;">' + esc(f.title || "") + '</div>',
      '<div class="prev" style="margin-bottom:16px;">Отправлено ' + esc(shortDate(r.submittedAt)) + '</div>',
    ];
    (f.fields || []).forEach(function (field) {
      if (field.type === "section") {
        parts.push('<div class="cat" style="margin:22px 0 6px;">' + esc(field.label || "") + '</div>');
        return;
      }
      var v = (r.answers || {})[field.id];
      var body;
      if (isFileList(v)) {
        body = v.map(function (file) {
          return '<div class="row" style="padding:10px 0;"><div><div class="ttl" style="font-size:15px;">' + esc(file.name || file.id) + '</div>' +
            '<div class="prev">' + esc(humanBytes(file.size)) + '</div></div>' +
            '<div class="side"><span class="badge" data-file="' + esc(file.id) + '" data-name="' + esc(file.name || file.id) + '">скачать</span></div></div>';
        }).join("");
      } else if (Array.isArray(v)) {
        body = v.length ? '<div class="prev" style="font-size:15px;color:var(--ink);">' + esc(v.join(", ")) + '</div>' : '<div class="prev">—</div>';
      } else if (v === undefined || v === null || String(v).trim() === "") {
        body = '<div class="prev">—</div>';
      } else {
        body = String(v).split(/\n\s*\n/).map(function (p) {
          return '<div style="font-size:15px;line-height:1.55;margin-bottom:8px;white-space:pre-wrap;">' + esc(p) + '</div>';
        }).join("");
      }
      parts.push('<div style="margin-bottom:18px;">' +
        '<div style="font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.4;">' + esc(field.label || field.id) + '</div>' +
        body + '</div>');
    });
    parts.push('<div class="new-row" style="margin-top:24px;">' +
      '<button class="new-btn" data-act="copytext">Скопировать текст</button>' +
      '<button class="new-btn" data-act="respzip">Файлы zip</button>' +
      (ROLE === "admin" ? '<button class="new-btn" data-act="delresp">Удалить ответ</button>' : '') +
      '</div>');
    $("respBody").innerHTML = parts.join("");

    $("respBody").querySelectorAll("[data-file]").forEach(function (btn) {
      btn.onclick = function () {
        downloadProtected(FORMS_API + "/" + encodeURIComponent(f.id) + "/files/" + encodeURIComponent(btn.dataset.file), btn.dataset.name, btn);
      };
    });
    $("respBody").querySelectorAll("[data-act]").forEach(function (btn) {
      var act = btn.dataset.act;
      btn.onclick = function () {
        if (act === "copytext") return copy(responseAsText(f, r), "Ответ");
        if (act === "respzip") return downloadProtected(FORMS_API + "/" + encodeURIComponent(f.id) + "/files.zip?response=" + encodeURIComponent(r.id), (f.slug || "files") + ".zip", btn);
        if (act === "delresp") return deleteResponse();
      };
    });
  }

  /* Текст ответа целиком — то, ради чего анкету и заводили: его переносят в
     материал. Собираем «вопрос — ответ» в один кусок для буфера обмена. */
  function responseAsText(form, response) {
    var out = [form.title || "", response.inviteLabel ? "Ответ: " + response.inviteLabel : "", ""];
    (form.fields || []).forEach(function (field) {
      if (field.type === "section") { out.push("— " + (field.label || "") + " —", ""); return; }
      var v = (response.answers || {})[field.id];
      if (isFileList(v)) v = v.map(function (f2) { return f2.name || f2.id; }).join(", ");
      if (Array.isArray(v)) v = v.join(", ");
      out.push(field.label || field.id, String(v == null || v === "" ? "—" : v), "");
    });
    return out.join("\n");
  }

  async function deleteResponse() {
    if (!window.confirm("Удалить ответ вместе с файлами? Это необратимо.")) return;
    var f = currentForm.form, r = currentResponse;
    var res = await fetchJSON(FORMS_API + "/" + encodeURIComponent(f.id) + "/responses/" + encodeURIComponent(r.id), {
      method: "DELETE", headers: formsHeaders(),
    });
    if (!res.data || !res.data.ok) { toast("Не удалилось: " + ((res.data && res.data.error) || res.status), true); return; }
    currentForm.responses = currentForm.responses.filter(function (x) { return x.id !== r.id; });
    currentResponse = null;
    toast("Ответ удалён");
    formsLoaded = false;
    showFormsView("form-view");
  }

  /* Файл лежит за паролем, поэтому обычная ссылка его не откроет: тянем тело
     с заголовком и отдаём браузеру уже готовый blob. */
  async function downloadProtected(url, filename, btn) {
    var label = btn ? btn.textContent : "";
    if (btn) { btn.textContent = "…"; btn.style.pointerEvents = "none"; }
    try {
      var res = await fetch(url, { headers: formsHeaders() });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var blob = await res.blob();
      var href = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = href;
      a.download = filename || "file";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(href); }, 30000);
      toast("Файл выгружен");
    } catch (e) {
      toast("Не скачалось: " + e.message + ". Открой в админке на компьютере", true);
    } finally {
      if (btn) { btn.textContent = label; btn.style.pointerEvents = ""; }
    }
  }

  $("formsLink").onclick = openForms;
  $("formsSearch").oninput = renderFormsList;

  boot();
})();
</script>
</body>
</html>
