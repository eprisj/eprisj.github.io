<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>EPRIS</title>
  <!-- Белый круг на прозрачном фоне: на тёмной панели браузера значок читается
       кружком, на светлой — краем сливается с ней. Знак векторный, поэтому он
       одинаково чёткий и в шестнадцати пикселях вкладки, и на плитке
       приложения. Посадка знака оптическая, а не геометрическая: акут висит
       над правой половиной буквы и перетягивает её вправо. -->
  <circle cx="256.0" cy="256.0" r="256.0" fill="#FFFFFF"/>
  <g fill="#0B0B0C">
    <rect x="173.17" y="183.83" width="29.63" height="220.25"/>
    <rect x="173.17" y="183.83" width="152.57" height="24.03"/>
    <rect x="173.17" y="278.74" width="144.16" height="24.03"/>
    <rect x="173.17" y="379.65" width="152.57" height="24.43"/>
    <polygon points="287.7,117.76 254.46,117.76 226.03,167.42 259.27,167.42"/>
  </g>
</svg>
