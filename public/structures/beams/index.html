.steps .f{font-family:var(--san);font-style:normal;font-size:16px;margin-top:14px}
.steps .f .sym{font-size:17px;padding-bottom:12px;margin-bottom:12px;line-height:2}
.steps .f .num{font-size:15.5px;line-height:2.05}
.steps .f b{font-weight:700}
.steps .why{font-size:14.5px;line-height:1.6;margin-top:14px}
.c{font-style:normal;font-weight:600;padding:2px 7px;border-radius:7px;background:color-mix(in srgb,currentColor 13%,transparent);margin:0 1px}
.cw{color:var(--load)}.cL{color:var(--cL)}.cM{color:var(--mom)}.cI{color:var(--cI)}.cW{color:var(--cW)}.cd{color:var(--cd)}.cf{color:var(--ok)}
.clg span{border:0;background:color-mix(in srgb,currentColor 13%,transparent);font:600 13px var(--san);padding:6px 13px}
.rw .nm b{font:600 18px var(--san);letter-spacing:-.01em}
.rw .bb span{font:600 12px var(--san);font-style:normal}
.lim b,.gl2 b{font:600 22px var(--san);letter-spacing:-.02em}
.lim b{font-size:34px}
.gl2 p{font-size:14.5px}
.hud .p{font-family:var(--san)}
.bub h4{font:600 20px/1.25 var(--san);letter-spacing:-.02em}
.bub{font-size:14.5px;border-width:1px;border-radius:22px 22px 22px 6px}
.mini2{font:600 13px var(--san)}
.ipnote,.mini{font-size:14.5px}
@media(max-width:560px){main{padding-bottom:200px!important}}
/* ---- iPhone ---- */
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
header{padding-top:max(12px,env(safe-area-inset-top));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
#bur{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom))}
.seg button,.pills button,.bub .nav button,.mini2{min-height:44px}
.seg button{padding-left:16px;padding-right:16px}
input[type=range]{height:44px;touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:9px}
.bub{overscroll-behavior:contain}
@media(max-width:640px){
  h1{font-size:clamp(44px,14vw,64px);margin-top:24px}
  .top{gap:16px}
  .top .seg{width:100%}.top .seg button{flex:1}
  .stage{border-radius:18px;padding:8px 4px 14px}
  #viz{margin-left:-2px}
  #viz .tb{font-size:21px}#viz .t{font-size:19px}
  #stress .tb{font-size:19px}#stress .t{font-size:17px}
  .leg{grid-template-columns:1fr;margin-top:10px}
  .sl b{font-size:26px}
  .nums b{font-size:28px}
  .now{padding:22px 20px}
  .card{padding:20px 18px}
  .pick{gap:14px}.pick svg{width:92px}
  .hud span.p{font-size:14px}
  h3{margin-top:56px}
  .bub{max-height:48vh}
  .lim{grid-template-columns:repeat(3,1fr)}.lim b{font-size:26px}.lim .card{padding:14px 8px}.lim span{font-size:12px}
}
@media(max-width:380px){.steps{grid-template-columns:1fr}.rw{padding:10px}}

<header>

  $("sl").className="sl"+(mode==="h"?" h":"");

  $("sl").querySelectorAll("input").forEach(el=>{pc(el);el.oninput=()=>{S[el.dataset.k]=+el.value;pc(el);calc()}});

  $("strip").innerHTML=IPE.map(p=>{const okI=p[4]>=Imin,okW=p[5]>=Wmin,ok=okI&&okW,on=pick&&p[0]===pick[0];
   return `<div class="rw ${on?"on":ok?"":"no"}">${on?`<span class="badge">${ru?"ПОДБОР":"PICK"}</span>`:""}<div class="nm"><svg viewBox="0 0 120 120">${secSVG(p,"currentColor",1)}</svg><div><b>IPE ${p[0]}</b><small>${fmt(p[6],1)} ${ru?"кг/м":"kg/m"}</small></div></div>${bar("I",p[4],Imin,ru?"см⁴":"cm⁴")}${bar("W",p[5],Wmin,ru?"см³":"cm³")}<div class="vd ${ok?"cf":""}" style="${ok?"":"color:var(--mut)"}">${ok?"✓":"✗"}</div></div>`}).join("");
}

const saveOpen=()=>{try{localStorage.setItem("burOpen",BOPEN?"1":"0")}catch(e){}};
const CHIP=`<svg class="av" id="avatar" viewBox="-20 0 160 196" aria-label="Bur">
<defs>
<linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0a05c"/><stop offset="1" stop-color="#b9743a"/></linearGradient>

<ellipse cx="66" cy="190" rx="46" ry="5" fill="#000" opacity=".16"/>

function tips(){
  const C=CTX,v=C.v,tr=(a,b)=>lang==="ru"?a:b,f1=x=>fmt(x,1),f0=x=>fmt(x,0),tn=x=>fmt(x/9.81,1);
  const Wt=C.wU*C.Lm,R=C.R,pct=C.d/C.dl*100,P=C.P[0];
  const dec=!C.pick?"":C.iI===C.iW?tr("Подошёл по обоим условиям одновременно.","It passes both checks at the same size."):C.iW>C.iI?tr(`Заметь: по жёсткости хватило бы IPE ${IPE[C.iI][0]}, но по прочности он слабоват — нужен ${P}.`,`Note: stiffness alone would allow IPE ${IPE[C.iI][0]}, but it is too weak in strength — you need ${P}.`):tr(`Заметь: по прочности хватило бы IPE ${IPE[C.iW][0]}, но он прогнётся — нужен ${P}.`,`Note: strength alone would allow IPE ${IPE[C.iW][0]}, but it would sag — you need ${P}.`);
  const S0=tr([
   ["stage","Привет! Я Бур","Я бурундук-инженер. Видишь <b>балку</b>? Это как доска между двумя стульями. Если положить на неё груз, она <b>прогнётся</b>, а если груза слишком много — <b>сломается</b>. Работа инженера — подобрать такой профиль IPE, чтобы не было ни того, ни другого. Жми «Дальше», разберём всё по шагам."],
   ["stage","1. Нагрузка — синие стрелки",v?`Плита и люди давят на <b>квадратные метры</b>, а мы считаем одну балку. Поэтому переводим в «кН на метр длины»: каждая балка держит полосу шириной <b>${f1(S.i)} м</b>. Постоянная g = ${fmt(S.G,2)}×${f1(S.i)} = <b>${fmt(C.g,2)}</b> кН/м, временная q = ${f1(S.Q)}×${f1(S.i)} = <b>${fmt(C.q,2)}</b> кН/м. Вместе ${fmt(C.g+C.q,2)}, с запасом ×1,5 получаем <b>${f1(C.wU)} кН/м</b>. На всю балку это ${f0(Wt)} кН — как примерно ${tn(Wt)} т.`:`Ветер давит на стену, стена передаёт нагрузку на стойку: ${fmt(S.P,2)}×${f1(S.i)} = <b>${fmt(C.q,2)}</b> кН/м по всей высоте. С запасом ×1,5: <b>${f1(C.wU)} кН/м</b>. Всего на стойку действует горизонтальная сила ${f0(Wt)} кН (≈ ${tn(Wt)} т).`],
   ["stage","2. Опоры — зелёные стрелки",v?`Балка не падает, потому что опоры толкают её <b>вверх</b>. Груз у нас симметричный, значит каждая опора берёт ровно половину: R = wL/2 = ${f1(C.wU)}×${f1(C.Lm)}/2 = <b>${f1(R)} кН</b>. Сумма двух реакций равна всей нагрузке — иначе балка поехала бы вверх или вниз. Это называется равновесие.`:`Стойка заделана внизу в фундамент. Ветер толкает её вправо, значит фундамент должен толкнуть <b>влево</b> с силой R = w·H = ${f1(C.wU)}×${f1(C.Lm)} = <b>${f1(R)} кН</b>. И ещё удержать от опрокидывания — этот «заворот» и есть момент.`],
   ["stage","3. Поперечная сила V",v?`Мысленно разрежь балку в любом месте. Слева: опора толкает вверх на R, нагрузка давит вниз. На самой опоре перерезывающая сила максимальна — <b>${f0(R)} кН</b>, к середине она падает до нуля (сколько вверх — столько вниз), а за серединой меняет знак. Это график V. Он нужен, чтобы стенка не срезалась, но главное в нашей задаче — момент.`:`Разрежь стойку на любой высоте — выше разреза действует ветер, ниже — реакция. Внизу сила максимальна (${f0(R)} кН), вверху — ноль: выше разреза просто нет ветра. График V — треугольник.`],
   ["stage","4. Изгибающий момент — красная эпюра",v?`Опора толкает вверх на <b>плече</b> — как рука, которая гнёт линейку. Чем дальше от опоры, тем плечо длиннее, поэтому момент растёт к середине и там максимален: M = wL²/8 = ${f1(C.wU)}×${f1(C.Lm)}²/8 = <b>${f1(C.M)} кН·м</b>. Видишь квадрат? Удвоишь пролёт — момент вырастет в <b>4 раза</b>.`:`Ветер на высоте H/2 тянет с плечом — как рычаг. Чем выше, тем больше «рычаг»: M = wH²/2 = ${f1(C.wU)}×${f1(C.Lm)}²/2 = <b>${f1(C.M)} кН·м</b>. Максимум — <b>внизу</b>, у заделки. Туда и бьёт: стойка «ломается» именно там.`],
   ["stage","5. Прогиб δ",`Под нагрузкой ${v?"балка проседает":"верх стойки уходит в сторону"}: <b>δ = ${f1(C.d)} мм</b>. На рисунке я его сильно увеличил, иначе ты бы ничего не увидел. Допуск ${f1(C.dl)} мм (1/${S.lim} от ${v?"пролёта":"высоты"}) — чтобы ${v?"потолок не трескался и пол не «пружинил»":"фасад и окна не ломались"}. Сейчас использовано <b>${f0(pct)}%</b> допуска${pct>100?" — это уже нарушение!":"."} Прогиб растёт как 4-я степень длины: удвоишь — станет в 16 раз больше.`],
   ["inside","6. Что внутри балки","Балка изгибается как лук. <b>Верх сжимается</b> (волокна укорачиваются), <b>низ растягивается</b>, а посередине есть нейтральная ось — там напряжение ноль. Чем дальше от оси, тем сильнее нагружен металл. На самом краю: <b>σ = M / W = "+f0(C.sig)+" МПа</b>. Поэтому металл двутавра собран в полки сверху и снизу, а стенка тонкая."],
   ["pickcard","7. Подбор профиля",`Нужно пройти два экзамена. <b>Жёсткость:</b> I ≥ ${f0(C.Imin)} см⁴ (чтобы прогиб не превысил допуск). <b>Прочность:</b> W ≥ ${f0(C.Wmin)} см³ (чтобы σ ≤ ${f0(S.fa)} МПа). Из таблицы берём самый лёгкий профиль, который сдаёт оба: ${C.pick?`<b>IPE ${P}</b>. ${dec}`:"такого нет — уменьши пролёт или нагрузку."}`],
   ["ctl","Теперь твоя очередь!","Двигай ползунки и смотри, как меняются стрелки, эпюры и профиль. Увеличь пролёт — момент и прогиб взлетят. Нажми «Попробуйте» для быстрых экспериментов. Захочешь повторить — кликни на меня."]
  ],[
   ["stage","Hi! I'm Bur","I'm an engineer chipmunk. See the <b>beam</b>? It's like a plank between two chairs. Put a weight on it and it will <b>sag</b>; put too much and it will <b>break</b>. The engineer's job is to pick an IPE section so neither happens. Press “Next” and we'll go step by step."],
   ["stage","1. Load — blue arrows",v?`The slab and people press on <b>square metres</b>, but we design one beam. So we convert to “kN per metre of length”: each beam carries a strip <b>${f1(S.i)} m</b> wide. Permanent g = ${fmt(S.G,2)}×${f1(S.i)} = <b>${fmt(C.g,2)}</b> kN/m, variable q = ${f1(S.Q)}×${f1(S.i)} = <b>${fmt(C.q,2)}</b> kN/m. Together ${fmt(C.g+C.q,2)}; with the ×1.5 safety factor we get <b>${f1(C.wU)} kN/m</b>. Over the whole beam that is ${f0(Wt)} kN — about ${tn(Wt)} tonnes.`:`Wind pushes on the wall, the wall passes it to the column: ${fmt(S.P,2)}×${f1(S.i)} = <b>${fmt(C.q,2)}</b> kN/m along the height. With ×1.5: <b>${f1(C.wU)} kN/m</b>. In total a horizontal force of ${f0(Wt)} kN (≈ ${tn(Wt)} t).`],
   ["stage","2. Supports — green arrows",v?`The beam doesn't fall because the supports push it <b>up</b>. The load is symmetric, so each support takes exactly half: R = wL/2 = ${f1(C.wU)}×${f1(C.Lm)}/2 = <b>${f1(R)} kN</b>. The two reactions add up to the whole load — otherwise the beam would move. That is equilibrium.`:`The column is fixed into the foundation. Wind pushes it right, so the foundation must push <b>left</b> with R = w·H = ${f1(C.wU)}×${f1(C.Lm)} = <b>${f1(R)} kN</b>, and also stop it from tipping — that “twist” is the moment.`],
   ["stage","3. Shear force V",v?`Cut the beam anywhere. On the left: the support pushes up with R, the load pushes down. At the support the shear is largest — <b>${f0(R)} kN</b>; it drops to zero at midspan (up equals down) and changes sign. That is the V diagram. It checks that the web doesn't shear off, but the key one here is the moment.`:`Cut the column at any height: wind acts above, the reaction below. At the base the shear is largest (${f0(R)} kN), at the top it is zero — there is no wind above. V is a triangle.`],
   ["stage","4. Bending moment — red diagram",v?`The support pushes up on an <b>arm</b> — like a hand bending a ruler. The farther from the support, the longer the arm, so the moment grows toward midspan: M = wL²/8 = ${f1(C.wU)}×${f1(C.Lm)}²/8 = <b>${f1(C.M)} kN·m</b>. See the square? Double the span and the moment grows <b>4×</b>.`:`Wind at height H/2 acts with an arm — a lever. The higher, the longer: M = wH²/2 = ${f1(C.wU)}×${f1(C.Lm)}²/2 = <b>${f1(C.M)} kN·m</b>. The peak is at the <b>base</b>, so that's where the column fails first.`],
   ["stage","5. Deflection δ",`Under load the ${v?"beam sags":"column top moves sideways"}: <b>δ = ${f1(C.d)} mm</b>. I exaggerated it in the picture, otherwise you would see nothing. The limit is ${f1(C.dl)} mm (1/${S.lim} of the ${v?"span":"height"}) so that ${v?"the ceiling doesn't crack and the floor doesn't feel bouncy":"the façade and windows don't break"}. Used: <b>${f0(pct)}%</b> of the limit${pct>100?" — that's a violation!":"."} Deflection grows with the 4th power of length: double it and it becomes 16× bigger.`],
   ["inside","6. Inside the beam","A beam bends like a bow. <b>The top is compressed</b> (fibres get shorter), <b>the bottom is stretched</b>, and in the middle there's a neutral axis where stress is zero. The farther from it, the harder the steel works. At the very edge: <b>σ = M / W = "+f0(C.sig)+" MPa</b>. That's why an I-section keeps its steel in the flanges at top and bottom, with a thin web."],
   ["pickcard","7. Picking the section",`Two exams to pass. <b>Stiffness:</b> I ≥ ${f0(C.Imin)} cm⁴ (deflection within the limit). <b>Strength:</b> W ≥ ${f0(C.Wmin)} cm³ (σ ≤ ${f0(S.fa)} MPa). From the table take the lightest section that passes both: ${C.pick?`<b>IPE ${P}</b>. ${dec}`:"none exists — reduce the span or the load."}`],
   ["ctl","Your turn!","Move the sliders and watch the arrows, diagrams and section change. Increase the span — the moment and deflection explode. Use “Try” for quick experiments. To repeat the tour, click me."]
  ]);
  return S0;
}
function renderBur(){
  if(!CTX.P)return;
  const T0=tips(),k=Math.min(BS,T0.length-1),[,h,b]=T0[k],tr=(a,b)=>lang==="ru"?a:b;
  $("bur").innerHTML=CHIP+(BOPEN?`<div class="bub"><button class="x" id="bx" aria-label="minimize">${tr("Свернуть","Minimize")} ▾</button><span class="bubtag">${tr("БУР · ИНЖЕНЕР","BUR · ENGINEER")}</span><h4>${h}</h4><div>${b}</div><div class="nav"><button class="g" id="bp" ${k?"":"disabled style=opacity:.35"}>←</button><div class="dots">${T0.map((_,i)=>`<i class="${i===k?"on":""}"></i>`).join("")}</div><button id="bn">${k===T0.length-1?tr("Сначала","Restart"):tr("Дальше","Next")} →</button></div></div>`:`<button class="mini2" id="bm">${tr("Подсказки Бура","Ask Bur")} ▸</button>`);
  $("avatar").onclick=()=>{BOPEN=!BOPEN;saveOpen();renderBur()};
  if(!BOPEN)$("bm").onclick=()=>{BOPEN=true;saveOpen();renderBur()};
  if(BOPEN){
    $("bx").onclick=()=>{BOPEN=false;saveOpen();spot(null);renderBur()};
    $("bp").onclick=()=>{BS=Math.max(0,BS-1);go()};
    $("bn").onclick=()=>{BS=BS>=T0.length-1?0:BS+1;go()};
  }
}
function spot(id){document.querySelectorAll(".spot").forEach(e=>e.classList.remove("spot"));if(id){const e=$(id);e.classList.add("spot");return e}}
function go(){const T0=tips(),e=spot(T0[BS][0]);renderBur();if(e)e.scrollIntoView({behavior:"smooth",block:BS===0||T0[BS][0]==="stage"?"start":"center"})}
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=X[lang][el.dataset.t]||t(el.dataset.t));
  $("gloss").innerHTML=X[lang].gloss.map(([a,b,c])=>`<div class="card"><b>${a}</b><i>${b}</i><p>${c}</p></div>`).join("");
  $("lim").innerHTML=[["L/400",t("slab")+" · q"],["L/250",t("slab")+" · g+q"],["L/200",t("roof")+" · g+q"]].map(([a,b])=>`<div class="card"><b>${a}</b><span>${b}</span></div>`).join("");
  buildControls();calc();
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll("#lang button").forEach(x=>x.classList.toggle("on",x===b));render()});
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll("#mode button").forEach(x=>x.classList.toggle("on",x===b));render()});
render();
</script>
