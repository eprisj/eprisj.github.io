    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EPRIS Journal",
      "alternateName": "EPRIS",
      "url": "https://eprisjournal.com/",
      "description": "Independent international journal and cultural platform exploring contemporary art, architecture, interior design and cities in context.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://eprisjournal.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "inLanguage": "en",
      "publisher": {
        "@type": "Organization",
        "name": "EPRIS Journal",
        "url": "https://eprisjournal.com/",
        "logo": "https://eprisjournal.com/images/featured.png"
      }
    }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <script>
      // Handle SPA redirect from 404.html (GitHub Pages)
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <div id="root"></div>
  </body>
