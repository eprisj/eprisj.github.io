    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Совпадает с дефолтным фоном страницы: до загрузки темы из панели
         панель браузера не должна вспыхивать цветом старой палитры. Дальше

    <meta name="theme-color" content="#f5f0eb" />
    <link rel="canonical" href="https://eprisjournal.com/" />
    <!-- Без этой строки ленту находят только те, кто знает адрес: читалки
         и агрегаторы ищут её именно в <head>. -->
    <link rel="alternate" type="application/rss+xml" title="EPRIS Journal" href="https://eprisjournal.com/rss.xml" />

    <!-- Open Graph -->
    <meta property="og:title" content="EPRIS Journal | Contemporary Art, Architecture &amp; Interior Design" />
    <meta property="og:description" content="Independent international journal and cultural platform for contemporary art, architecture, interior design, designers, artists, interviews and city culture." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EPRIS Journal | Contemporary Art, Architecture &amp; Interior Design" />
    <meta name="twitter:description" content="Independent international journal and cultural platform for contemporary art, architecture, interior design, designers, artists, interviews and city culture." />
    <meta name="twitter:image" content="https://eprisjournal.com/og/home.jpg" />

    <!-- Значок: белый круг с É на прозрачном фоне. Версия в адресе нужна,
         потому что браузеры держат фавикон в отдельном долгом кэше и без неё
         месяцами показывают прежний. -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=3" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Картинки лежат на другом origin, и до них идёт отдельное
         TLS-рукопожатие уже после того, как разобран HTML. Для LCP-картинки
         это чистая задержка на ровном месте. -->
    <link rel="preconnect" href="https://api.eprisjournal.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbit&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Zeyada&display=swap" rel="stylesheet">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F3F5GCXFBF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      /* Один ресурс GA на оба сайта; группа контента делит отчёты на
         журнал и Daily (Engagement → Pages and screens → Content group). */
      gtag('config', 'G-F3F5GCXFBF', {
        content_group: location.hostname === 'daily.eprisjournal.com' ? 'Daily' : 'Journal'
      });
    </script>

    <!-- Власний лічильник (легший за GA, для швидкого приватного числа
         без панелі Google): б'є на кожен вхід і на кожну зміну маршруту
         SPA, бо React Router міняє URL без перезавантаження сторінки. -->
    <script>
      (function () {
        /* Точность. Роботов маячок не шлёт: их запросы к страницам пишет лог
           nginx, и счётчик показывает их отдельно (иначе Googlebot, который
           исполняет JS, считался бы дважды). Просмотр по ссылке предпросмотра
           записывается с пометкой «редакция». Тот же адрес повторно не
           засчитывается: сайт сам нормализует /article/12 в слаг через
           replaceState, и раньше это давало два просмотра вместо одного. */
        var ua = navigator.userAgent || "";
        if (navigator.webdriver || /bot|crawl|spider|headless|lighthouse|pagespeed|preview/i.test(ua)) return;
        var API = "https://api.eprisjournal.com/analytics/";
        var post = function (route, data) {
          try {
            var body = JSON.stringify(data);
            /* text/plain, а не application/json: sendBeacon шлёт запрос
               с credentials и не умеет preflight, поэтому любой
               несупростой Content-Type он молча роняет на CORS.
               Сервер разбирает тело как JSON независимо от заголовка. */
            if (navigator.sendBeacon) {
              navigator.sendBeacon(API + route, new Blob([body], { type: "text/plain;charset=UTF-8" }));
            } else {
              fetch(API + route, { method: "POST", body: body, keepalive: true,
                headers: { "Content-Type": "text/plain;charset=UTF-8" } }).catch(function () {});
            }
          } catch (e) {}
        };
        /* Визит = вкладка: идентификатор живёт в sessionStorage, без cookie. */
        var sid = "";
        try {
          sid = sessionStorage.getItem("epris_sid") || "";
          if (!sid) { sid = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); sessionStorage.setItem("epris_sid", sid); }
        } catch (e) {}
        var isPreview = function () { return /[?&]preview=/.test(location.search); };

        /* Вовлечённость: сколько страница была ВИДНА и как глубоко её
           прокрутили. Статьи читаются в оверлее со своей прокруткой, поэтому
           глубина берётся из любого прокручиваемого элемента, а не только окна. */
        var cur = null;
        var start = function () {
          cur = { path: location.pathname, host: location.hostname, ms: 0,
                  since: document.visibilityState === "visible" ? Date.now() : 0, depth: 0 };
        };
        var flush = function () {
          if (!cur) return;
          if (cur.since) { cur.ms += Date.now() - cur.since; cur.since = 0; }
          if (cur.ms >= 1000 && !isPreview()) {
            post("engage", { path: cur.path, host: cur.host, sid: sid, ms: Math.round(cur.ms), depth: Math.round(cur.depth) });
          }
          cur.ms = 0;
        };
        var measure = function (el) {
          if (!cur) return;
          var top, max;
          if (!el || el === document || el === document.documentElement || el === document.body) {
            top = window.scrollY || 0; max = (document.documentElement.scrollHeight || 0) - window.innerHeight;
          } else {
            top = el.scrollTop; max = el.scrollHeight - el.clientHeight;
          }
          if (max > 40) cur.depth = Math.max(cur.depth, Math.min(100, (top / max) * 100));
          else cur.depth = Math.max(cur.depth, 100);
        };
        addEventListener("scroll", function (ev) { measure(ev.target); }, { capture: true, passive: true });

        var lastSent = "";
        /* Внутри сайта источником перехода считается предыдущая страница,
           а не исходный referrer, который у SPA не меняется. */
        var prevUrl = document.referrer || "";
        var send = function () {
          var key = location.hostname + location.pathname;
          if (key === lastSent) return;
          flush();
          lastSent = key;
          start();
          setTimeout(function () { measure(document); }, 1500);
          var path = location.pathname, host = location.hostname, ref = prevUrl;
          prevUrl = location.href;
          var preview = isPreview();
          /* Заголовок страницы и ширина экрана нужны отчёту: путь вроде
             /article/23 ничего не говорит редакции, а разбивка по
             ширине показывает, с чего на самом деле читают. Заголовок
             берём чуть позже: приложение ставит его после смены адреса. */
          setTimeout(function () {
            post("hit", {
              path: path,
              /* eprisjournal.com или daily.eprisjournal.com: одна сборка
                 обслуживает оба сайта, статистика общая с разбивкой. */
              host: host,
              ref: ref,
              title: (document.title || "").slice(0, 200),
              w: window.screen ? window.screen.width : 0,
              sid: sid,
              preview: preview
            });
          }, 400);
        };
        send();
        ["pushState", "replaceState"].forEach(function (m) {
          var orig = history[m];
          history[m] = function () {
            var r = orig.apply(this, arguments);
            send();
            return r;
          };
        });
        addEventListener("popstate", send);
        document.addEventListener("visibilitychange", function () {
          if (!cur) return;
          if (document.visibilityState === "hidden") flush();
          else if (!cur.since) cur.since = Date.now();
        });
        addEventListener("pagehide", flush);
      })();
    </script>

  <body>
    <script>
      // Handle SPA redirect from 404.html (GitHub Pages)
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <div id="root"></div>
  </body>
</html>
